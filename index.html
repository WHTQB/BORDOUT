<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRISM RUN — Y2K roguelite</title>
<style>
:root {
  --rust: #ad543c;
  --steel: #6e8d8b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #b79a70;
  color: #332a22;
  font: 14px "Trebuchet MS", Arial, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

button,
input {
  font: inherit;
}

button {
  padding: 10px 15px;
  border: 2px solid #493a29;
  border-radius: 3px;
  background: linear-gradient(#e4c48a, #b99864);
  color: #30291e;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  cursor: pointer;
  box-shadow: 0 3px 0 #58452d;
}

button:hover:not(:disabled) {
  background: #eab45f;
}

button:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #58452d;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

button:focus-visible,
input:focus-visible,
summary:focus-visible {
  outline: 3px solid #52797a;
  outline-offset: 3px;
}

input {
  accent-color: #a56334;
}

#seed {
  max-width: 100%;
  padding: 8px;
  border: 1px solid #897251 !important;
  border-radius: 3px !important;
  background: #f0dfbd;
  color: #332a22;
}

input::placeholder {
  color: #807059;
}

input[type="range"] {
  max-width: 100%;
  vertical-align: middle;
}

label {
  display: block;
  margin: 15px 0;
}

h1,
h2,
h3,
p {
  margin: 0 0 12px;
}

h1,
h2,
h3 {
  text-transform: uppercase;
}

h1 {
  font-size: 29px;
  letter-spacing: 2px;
}

h3 {
  overflow-wrap: anywhere;
}

.panel {
  padding: 12px 16px;
  border: 2px solid #4d4030;
  border-radius: 5px;
  background: linear-gradient(135deg, #ead9b8f5, #c9b18eef);
  color: #332a22;
  box-shadow: 5px 6px 0 #30291e55;
  backdrop-filter: none;
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  max-width: min(590px, 72vw);
  pointer-events: none;
}

.bar {
  height: 12px;
  margin: 5px 0;
  overflow: hidden;
  border-radius: 2px;
  background: #736049;
}

.bar i {
  display: block;
  height: 100%;
  transition: width .15s;
}

#playerHUD .hp-bar i {
  background: var(--rust);
}

#lowerHUD {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr);
  align-items: end;
  gap: 12px;
  pointer-events: none;
}

#playerHUD {
  grid-column: 1;
  grid-row: 1;
  width: 100%;
  max-width: 360px;
  min-width: 0;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

#playerHUD .hero-values {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
}

#playerHUD .hero-upgrades {
  margin-top: 6px;
}

#playerHUD .hero-meters {
  display: grid;
  grid-template-columns: min(110px, 44%) minmax(0, 1fr);
  align-items: center;
  gap: 6px 8px;
  margin: 5px 0 8px;
}

#playerHUD .hero-meter-label {
  min-width: 0;
  font-size: 11px;
  font-weight: 800;
  line-height: 1.2;
}

#playerHUD .hero-meters .bar,
#playerHUD .hero-meters .armor-cells {
  width: 100%;
  min-width: 0;
  margin: 0;
}

#playerHUD .hero-meters .armor-cells {
  gap: clamp(1px, .25vw, 4px);
}

#hud {
  overflow-wrap: anywhere;
}

.armor-cells {
  display: flex;
  gap: 4px;
  height: 12px;
  margin: 5px 0;
}

.armor-cells i {
  flex: 1;
  min-width: 0;
  border: 1px solid #4c5b56;
  border-radius: 2px;
  background: var(--steel);
}

.armor-cells i.empty {
  border-color: #897251;
  background: #73604955;
}

#bottom {
  grid-column: 2;
  grid-row: 1;
  justify-self: center;
  width: 100%;
  max-width: 520px;
  min-width: 0;
  text-align: center;
  overflow-wrap: anywhere;
  pointer-events: none;
}

#toast {
  margin-bottom: 8px;
  color: #fff0ca;
  font-weight: 800;
  text-shadow: 1px 2px 2px #22180e;
}

#hint {
  font-weight: bold;
}

#topButtons {
  position: fixed;
  right: 14px;
  bottom: 270px;
}

#ammoHUD {
  grid-column: 3;
  grid-row: 1;
  justify-self: end;
  width: 260px;
  min-width: 0;
  max-width: 100%;
  pointer-events: none;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

#ammoHUD .ammo-weapon {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
  text-align: left;
}

#ammoHUD .ammo-weapon svg {
  flex: 0 0 108px;
  width: 108px;
  height: 52px;
}

#ammoHUD .ammo-weapon span {
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 12px;
  font-weight: bold;
}

#ammoHUD .ammo-label {
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
}

#ammoHUD .ammo-loaded {
  font-size: 52px;
  line-height: 1.1;
  font-weight: 900;
}

#ammoHUD .ammo-capacity {
  font-size: 26px;
  color: #736047;
}

#ammoHUD .ammo-reserve {
  font-size: 30px;
  line-height: 1.2;
  font-weight: 900;
}

#ammoHUD .ammo-status {
  min-height: 20px;
  margin-top: 4px;
  font-size: 13px;
  font-weight: bold;
}

#ammoHUD .ammo-empty {
  color: #a52d21;
}

#modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #241c13a8;
}

#modal.hidden {
  display: none;
}

.window {
  width: min(930px, 96vw);
  max-height: 90vh;
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: #897251 #d4bd95;
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: 12px;
}

.card {
  flex: 1;
  min-width: 225px;
  margin-bottom: 10px;
  padding: 14px;
  border: 1px solid #736047;
  border-radius: 3px;
  background: #efe0bf99;
}

.small {
  font-size: 12px;
  line-height: 1.6;
  opacity: .85;
}

.tag {
  display: inline-block;
  margin: 0 4px 6px 0;
  padding: 3px 8px;
  border-radius: 2px;
  background: #bba17a;
  color: #332a22;
  font-size: 12px;
  font-weight: bold;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

details {
  margin: 12px 0;
  padding: 10px;
  border: 1px solid #897251;
  border-radius: 3px;
  background: #e3cfaa80;
}

summary {
  color: #493a29;
  font-weight: bold;
  cursor: pointer;
}

details[open] summary {
  margin-bottom: 12px;
}

.inventory-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.inventory-heading h1 {
  margin: 0;
}

.inventory-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px;
}

.inventory-layout > section {
  min-width: 0;
}

.inventory-character {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 100px minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  min-height: 310px;
  padding: 8px;
  border: 1px solid #897251;
  background: #bba17a50;
}

.inventory-avatar {
  width: 100%;
  height: 290px;
}

.inventory-hand {
  min-width: 0;
}

.inventory-item {
  width: 100%;
  min-width: 0;
  padding: 8px;
  text-align: left;
  text-transform: none;
  letter-spacing: 0;
  overflow-wrap: anywhere;
}

.inventory-item svg {
  display: block;
  width: 100%;
  height: 60px;
  pointer-events: none;
}

.inventory-item[aria-pressed="true"] {
  border-color: #465636;
  background: #b9c68e;
  box-shadow: 0 3px 0 #465636;
}

.inventory-item[aria-pressed="true"] svg {
  width: calc(100% + 12px);
  height: 90px;
  margin-left: -6px;
  margin-right: -6px;
}

.inventory-tooltip svg {
  display: block;
  width: 100%;
  height: 180px;
}

.inventory-hand > button + button {
  width: 100%;
  margin-top: 8px;
  padding: 6px;
  font-size: 11px;
}

.inventory-floor {
  min-height: 120px;
  padding: 12px;
  border: 2px dashed #897251;
}

.inventory-floor h2 {
  font-size: 30px;
  letter-spacing: 2px;
}

.inventory-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  max-height: 42vh;
  overflow: auto;
  padding: 4px;
  overscroll-behavior: contain;
}

.inventory-shop {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 2px solid #897251;
}

.inventory-tooltip {
  position: fixed;
  z-index: 120;
  width: min(390px, calc(100vw - 16px));
  max-height: calc(100vh - 16px);
  overflow: auto;
  overscroll-behavior: contain;
  background: #ead9b8;
  box-shadow: 0 5px 20px #241c1370;
}

.inventory-tooltip .inventory-tooltip-actions {
  position: sticky;
  top: -12px;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: -12px -16px 10px;
  padding: 10px 12px;
  background: #dac399;
  border-bottom: 1px solid #897251;
}

.inventory-tooltip button {
  padding: 6px 8px;
  font-size: 11px;
}

.inventory-tooltip .weapon-stat {
  flex-wrap: wrap;
}

.inventory-tooltip .weapon-stat__value {
  margin-left: auto;
}

.inventory-tooltip:focus-visible {
  outline: 3px solid #52797a;
}

@media (max-width: 760px) {
  .inventory-layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .inventory-character {
    min-height: 260px;
    grid-template-columns: minmax(0, 1fr) 80px minmax(0, 1fr);
  }

  .inventory-avatar {
    height: 250px;
  }

  .inventory-heading h1 {
    font-size: 22px;
  }

  .inventory-tooltip .inventory-tooltip-actions {
    top: -10px;
    margin: -10px -12px 10px;
  }
}

.window.weapon-shop-window {
  height: 90vh;
  overflow: hidden;
}

.weapon-shop {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  gap: 8px;
}

.shop-heading,
.shop-equipped,
.shop-navigation {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.shop-heading {
  justify-content: space-between;
}

.shop-heading h2 {
  margin: 0;
  font-size: 19px;
}

.shop-heading button {
  padding: 6px 10px;
}

.weapon-shop .weapon-slot-picker {
  margin: 0;
}

.weapon-shop .weapon-slot-picker > p {
  display: none;
}

.weapon-shop .weapon-slot-picker .actions {
  flex-wrap: nowrap;
  margin: 0;
  gap: 6px;
}

.weapon-shop .weapon-slot-picker button {
  padding: 6px 8px;
  font-size: 11px;
  text-transform: none;
}

.shop-equipped {
  padding: 8px 10px;
  border: 2px solid #64744b;
  border-radius: 4px;
  background: #dae0b9;
}

.shop-equipped > svg {
  flex: 0 0 116px;
  width: 116px;
  height: 64px;
}

.shop-equipped > div {
  min-width: 0;
}

.shop-equipped h3 {
  margin: 2px 0;
  font-size: 14px;
}

.shop-equipped .small {
  line-height: 1.35;
}

.shop-navigation {
  position: sticky;
  top: 0;
  z-index: 2;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  margin-bottom: 10px;
  padding: 8px;
  border-bottom: 1px solid #897251;
  background: #e5d1aa;
}

.shop-arrow-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.shop-arrow-row > span {
  min-width: 0;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
}

.shop-arrow-row > button {
  flex: 0 0 auto;
}

.shop-navigation button {
  padding: 7px 10px;
}

.shop-navigation > span {
  font-size: 12px;
  font-weight: bold;
}

.shop-navigation .shop-purchase {
  width: 100%;
  margin-left: 0;
  white-space: normal;
  overflow-wrap: anywhere;
  background: #bccb91;
}

.shop-comparison {
  flex: 1 1 0;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #897251 #d4bd95;
  border-top: 1px solid #897251;
  padding-top: 8px;
}

.shop-comparison:focus-visible {
  outline: 3px solid #52797a;
  outline-offset: -3px;
}

.shop-comparison-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  align-items: start;
}

.shop-comparison .card {
  min-width: 0;
  margin: 0;
  padding: 10px;
}

.shop-comparison .shop-current {
  border: 2px solid #64744b;
}

.shop-comparison .shop-offer > svg {
  height: 58px;
}

.shop-comparison .weapon-stat {
  flex-wrap: wrap;
  gap: 2px 8px;
}

.shop-comparison .weapon-stat__value {
  margin-left: auto;
}

@media (max-width: 600px) {
  .window.weapon-shop-window {
    height: 94vh;
  }

  .shop-heading h2 {
    font-size: 15px;
  }

  .shop-equipped > svg {
    flex-basis: 76px;
    width: 76px;
    height: 46px;
  }

  .shop-equipped h3 {
    font-size: 12px;
  }

  .shop-comparison-grid {
    gap: 5px;
  }

  .shop-comparison .card {
    padding: 6px;
  }

  .shop-comparison h3 {
    font-size: 12px;
  }

  .shop-navigation .shop-purchase {
    flex-basis: auto;
    padding: 6px;
    font-size: 11px;
  }
}

@media (max-height: 520px) {
  .weapon-shop {
    gap: 4px;
  }

  .shop-equipped {
    padding: 3px 6px;
  }

  .shop-equipped > svg {
    height: 34px;
  }

  .shop-equipped .shop-equipped-extra {
    display: none;
  }

  .weapon-shop .weapon-slot-picker button {
    padding: 3px 6px;
  }

  .shop-navigation button {
    padding: 4px 8px;
  }
}

.weapon-slot-picker {
  margin: 12px 0 16px;
}

.weapon-slot-picker .actions {
  margin-top: 6px;
}

.weapon-slot-picker button {
  flex: 1 1 220px;
  min-width: 0;
  text-align: left;
  overflow-wrap: anywhere;
}

.weapon-slot-picker button[aria-pressed="true"] {
  background: #b9c68e;
  border-color: #465636;
  box-shadow: 0 3px 0 #465636;
}

.weapon-stat {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 5px 0;
  border-bottom: 1px solid #66543825;
  color: #332a22;
  font-size: 12px;
  line-height: 1.5;
}

.weapon-stat > span:first-child {
  min-width: 0;
}

.weapon-stat__value {
  flex-shrink: 0;
  text-align: right;
  font-weight: bold;
}

.weapon-diff {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 900;
  line-height: 1.4;
}

.weapon-diff--better {
  border: 1px solid #478047;
  background: #bce8ae;
  color: #185b23;
}

.weapon-diff--worse {
  border: 1px solid #b76857;
  background: #ffd0bf;
  color: #951e18;
}

.weapon-diff--equal {
  border: 1px solid #a99b84;
  background: #d7ccba;
  color: #655e51;
}

.weapon-effect {
  margin-top: 10px;
  padding: 8px;
  border: 1px dashed #897251;
  border-radius: 3px;
  background: #d7c19a55;
  color: #3b3024;
  font-size: 12px;
  line-height: 1.5;
}

@media (max-width: 600px) {
  #modal {
    padding: 10px;
  }

  .window {
    width: 100%;
    max-height: 94vh;
  }

  .panel {
    padding: 10px 12px;
  }

  h1 {
    font-size: 23px;
    letter-spacing: 1px;
  }

  .card {
    flex-basis: 100%;
    min-width: 0;
    padding: 12px;
  }

  #hud {
    top: 8px;
    left: 8px;
    max-width: 68vw;
    font-size: 12px;
  }

  #lowerHUD {
    left: 8px;
    right: 8px;
    bottom: 8px;
    gap: 8px;
  }

  #playerHUD,
  #ammoHUD {
    padding: 8px;
    font-size: 11px;
  }

  #playerHUD .small {
    font-size: 10px;
    line-height: 1.35;
  }

  #playerHUD .armor-cells {
    gap: 2px;
  }

  #ammoHUD .ammo-weapon {
    flex-wrap: wrap;
    gap: 2px;
  }

  #ammoHUD .ammo-weapon svg {
    flex-basis: 76px;
    width: 76px;
    height: 38px;
  }

  #ammoHUD .ammo-loaded {
    font-size: 36px;
  }

  #ammoHUD .ammo-reserve {
    font-size: 22px;
  }

  #bottom {
    max-width: 100%;
  }

  #hint {
    font-size: 11px;
  }

  .weapon-stat {
    flex-wrap: wrap;
    gap: 4px 8px;
  }

  .weapon-stat__value {
    margin-left: auto;
  }

  .weapon-diff {
    margin-left: 3px;
    padding: 2px 4px;
  }
}
</style>

</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="panel"></div>
<div id="lowerHUD">
 <div id="playerHUD" class="panel" aria-label="Состояние героя" hidden></div>
 <div id="bottom"><div id="toast"></div><div id="hint" class="panel"></div></div>
 <div id="ammoHUD" class="panel" aria-label="Боезапас активного оружия" hidden></div>
</div>
<div id="topButtons"><button id="pauseButton">Ⅱ</button></div>
<div id="modal"><div id="content" class="window panel"></div></div>

<script>
"use strict";
const CFG={
 cameraZoom:1.2,
 weaponShopChance:.85,upgradeShopChance:.7,
 baseEnemies:8,maxEnemies:25,saveSeconds:8,
 npcDetectionRadius:11.7,npcMoveMultiplier:1.7,npcFireMultiplier:1.995,
 npcShotDetectionMultiplier:3,npcShotDetectionSeconds:1,npcMemorySeconds:5,
 npcSpawnSeconds:15,npcSpawnCount:2,
 barrelBlastRadius:4,barrelDamageFraction:.8,
 staminaMax:100,staminaDrain:20,staminaRegen:8,
 staminaDelay:2,sprintMultiplier:1.815,staminaRestart:.25,
 healPrice:25,armorPrice:22,ammoPrice:12,
 medkitChance:.2,medkitHP:40,medkitSeconds:1,
 casePrice:l=>45+20*l
};
const KNIFE=Object.freeze({
 name:"Нож",damage:50,range:1.2,cooldown:.55,hitTime:.1,duration:.32,
 coneCos:.65
});
const KNIFE_ART={
 grip:"M-9 -3H3V3H-9Z",
 guard:"M2 -6H5V6H2Z",
 blade:"M5 -4H18L29 0L18 4H5Z"
};
const knifePaths=[
 new Path2D(KNIFE_ART.grip),new Path2D(KNIFE_ART.guard),new Path2D(KNIFE_ART.blade)
];
function knifePreview(){
 return `<svg viewBox="-14 -14 48 28" width="100%" height="100"
  role="img" aria-label="Нож">
  <g stroke="#292c28" stroke-width="1.5" stroke-linejoin="round">
   <path d="${KNIFE_ART.grip}" fill="#70523b"/>
   <path d="${KNIFE_ART.guard}" fill="#8c927d"/>
   <path d="${KNIFE_ART.blade}" fill="#d2ddd9"/>
   <path d="M6 0H25" fill="none" stroke="#ffffff"/>
  </g></svg>`;
}
function knifeStats(){
 return `<h3>Нож</h3>${knifePreview()}
  <span class="tag">Холодное оружие</span>
  <p>Урон: <b>${KNIFE.damage} HP</b><br>
  Дальность: ${KNIFE.range.toLocaleString("ru-RU")} м<br>

const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function distances(map,x,y){
 const n=map.n,d=Array(n*n).fill(-1);
 if(!Number.isInteger(x)||!Number.isInteger(y)||
    x<0||y<0||x>=n||y>=n||map.tiles[y*n+x]!==0)return d;
 const q=new Int32Array(n*n);
 let head=0,tail=1;
 q[0]=y*n+x;d[q[0]]=0;
 while(head<tail){
  const current=q[head++],cx=current%n,cy=Math.floor(current/n);
  for(const [dx,dy] of DIRS){
   const nx=cx+dx,ny=cy+dy,k=ny*n+nx;
   if(nx>=0&&ny>=0&&nx<n&&ny<n&&map.tiles[k]===0&&d[k]<0){
    d[k]=d[current]+1;q[tail++]=k;
   }
  }
 }
 return d;
}

function normalizeArmor(state){
 const p=state.p;
 if(p.armorVersion!==1){
  const maximum=Number.isFinite(p.maxArmor)&&p.maxArmor>0?p.maxArmor:50;
  const current=Number.isFinite(p.armor)?p.armor:0;
  p.armor=Math.ceil(clamp(current/maximum,0,1)*10);
 }else{
  p.armor=Number.isFinite(p.armor)?clamp(Math.floor(p.armor),0,10):0;
 }
 p.maxArmor=10;
 p.armorVersion=1;
 p.burn=Number.isFinite(p.burn)?clamp(p.burn,0,2):0;
 p.slow=Number.isFinite(p.slow)?clamp(p.slow,0,2):0;
}

}

function staminaStats(up){
 // Старые ID сохраняются для совместимости сохранений.
 return {
  max:CFG.staminaMax+25*(up.dashload||0),
  drain:CFG.staminaDrain*Math.pow(.9,up.endurance||0),
  regen:CFG.staminaRegen*(1+.25*(up.dash||0))
 };
}
function stepStamina(p,up,elapsed,wantsSprint,shiftHeld){
 const stats=staminaStats(up);
 const dt=Number.isFinite(elapsed)?Math.max(0,elapsed):0;
 if(dt===0)return 0;

 if(p.exhausted&&!shiftHeld&&p.stamina>=stats.max*CFG.staminaRestart){
  p.exhausted=false;
 }

 let runTime=0;
 if(wantsSprint&&!p.exhausted&&p.stamina>0){
  runTime=Math.min(dt,p.stamina/stats.drain);
  p.stamina=Math.max(0,p.stamina-stats.drain*runTime);
  p.staminaWait=CFG.staminaDelay;
  if(p.stamina<1e-8){
   p.stamina=0;
   p.exhausted=true;
  }
 }

 // Если запас закончился внутри кадра, остаток времени — отдых.
 const restTime=dt-runTime;
 if(restTime>0){
  const waiting=Math.min(p.staminaWait,restTime);
  p.staminaWait=Math.max(0,p.staminaWait-restTime);
  p.stamina=Math.min(stats.max,p.stamina+stats.regen*(restTime-waiting));
 }

 if(p.exhausted&&!shiftHeld&&p.stamina>=stats.max*CFG.staminaRestart){
  p.exhausted=false;
 }
 p.sprinting=runTime>0&&!p.exhausted;
 return runTime;
}

let serial=0;
function generateMap(seed,level){
 const r=rng(seed),n=23+2*Math.min(5,Math.floor(level/3));
 const map={seed,n,tiles:Array(n*n).fill(1),seen:Array(n*n).fill(false)};
 const carve=(x,y)=>map.tiles[y*n+x]=0;
 const stack=[[1,1]];carve(1,1);
 while(stack.length){
  const [x,y]=stack[stack.length-1];
  const options=shuffle(r,DIRS).filter(([dx,dy])=>{
   const nx=x+dx*2,ny=y+dy*2;
   return nx>0&&ny>0&&nx<n-1&&ny<n-1&&map.tiles[ny*n+nx]===1;
  });
  if(!options.length){stack.pop();continue}
  const [dx,dy]=options[0];carve(x+dx,y+dy);carve(x+dx*2,y+dy*2);
  stack.push([x+dx*2,y+dy*2]);
 }
 for(let i=0;i<14;i++){
  const x=1+Math.floor(r()*(n-5)),y=1+Math.floor(r()*(n-5));
  for(let a=x;a<x+4;a++)for(let b=y;b<y+4;b++)carve(a,b);
 }
 for(let y=1;y<5;y++)for(let x=1;x<5;x++)carve(x,y);
 const d=distances(map,2,2),floors=[];
 for(let y=1;y<n-1;y++)for(let x=1;x<n-1;x++)
  if(d[y*n+x]>=0)floors.push({x:x+.5,y:y+.5,d:d[y*n+x]});
 floors.sort((a,b)=>b.d-a.d);
 map.start={x:2.5,y:2.5};map.exit={...floors[0]};
 const candidates=shuffle(r,floors.filter(p=>p.d>8&&dist(p,map.exit)>4));
 map.shops=[];
 if(r()<CFG.weaponShopChance)map.shops.push({...candidates.shift(),kind:"weapons"});
 if(r()<CFG.upgradeShopChance){
  const p=candidates.find(p=>map.shops.every(s=>dist(s,p)>5));
  if(p)map.shops.push({...p,kind:"upgrades"});
 }
 map.floors=floors;
 return map;
}
function validateMap(map){
 if(!map||!Number.isInteger(map.n)||map.n<3||
    !Array.isArray(map.tiles)||map.tiles.length!==map.n*map.n||
    !Array.isArray(map.shops))return false;
 const start=map.start??{x:2.5,y:2.5};
 const walkable=p=>{
  if(!p||!Number.isFinite(p.x)||!Number.isFinite(p.y))return false;
  const x=Math.floor(p.x),y=Math.floor(p.y);
  return x>=0&&y>=0&&x<map.n&&y<map.n&&map.tiles[y*map.n+x]===0;
 };
 const targets=[map.exit,...map.shops];
 if(!walkable(start)||!targets.every(walkable))return false;
 const d=distances(map,Math.floor(start.x),Math.floor(start.y));
 return targets.every(p=>d[Math.floor(p.y)*map.n+Math.floor(p.x)]>=0);
}

 v.setUint16(20,1,true);v.setUint16(22,count,true);
 v.setUint32(24,sampleRate,true);v.setUint32(28,sampleRate*count*2,true);
 v.setUint16(32,count*2,true);v.setUint16(34,16,true);
 text(36,"data");v.setUint32(40,length*count*2,true);

function updateSoundStatus(){

  ?`Встроенные эффекты готовы: ${soundBank.size} сэмпл. Фоновая музыка: ${soundtrackFile}.`

async function buildSoundBank(){

  const variants=name==="ambience"?1:3;
  for(let variant=0;variant<variants;variant++){
   const wav=synthesizeSound(name,variant);
   const buffer=await audio.decodeAudioData(wav.slice(0));
   if(!buffer.length||!Number.isFinite(buffer.duration)){
    throw Error("Не удалось декодировать "+name);
   }
   soundBank.set(name+"_"+variant,{wav,buffer});
  }
  // Отдаём управление странице между группами сэмплов.
  await new Promise(resolve=>setTimeout(resolve,0));
 }
 rebuildSoundVariants();
 soundReady=true;
 syncSound();
}
function unlockSound(){
 try{
  if(!audio){
   const AudioContextClass=window.AudioContext||window.webkitAudioContext;
   if(!AudioContextClass)return Promise.resolve(false);
   audio=new AudioContextClass();
   soundMaster=audio.createGain();
   soundEffects=audio.createGain();
   soundSteps=audio.createGain();
   soundAmbient=audio.createGain();
   soundMaster.gain.value=0;
   soundAmbient.gain.value=0;
   soundEffects.connect(soundMaster);
   soundSteps.connect(soundMaster);
   soundAmbient.connect(soundMaster);
   const compressor=audio.createDynamicsCompressor();
   compressor.threshold.value=-10;
   compressor.knee.value=12;
   compressor.ratio.value=8;
   compressor.attack.value=.003;
   compressor.release.value=.15;
   soundMaster.connect(compressor);
   compressor.connect(audio.destination);
  }
  // resume вызывается непосредственно из пользовательского события.
  if(audio.state==="suspended")audio.resume().catch(()=>{});
  if(!soundLoading){
   soundLoading=buildSoundBank().then(()=>{
    soundError="";
    syncSound();
    updateSoundStatus();
    return true;
   }).catch(error=>{
    soundError="Не удалось подготовить звук. Обновите страницу для повторной попытки.";
    console.warn("WAV audio:",error);
    updateSoundStatus();
    return false;
   });
   updateSoundStatus();
  }
  syncSound();
  return soundLoading;
 }catch(error){
  soundError="Аудио недоступно в этом браузере.";
  updateSoundStatus();
  return Promise.resolve(false);
 }
}
function releaseSoundVoice(voice){

}
function stopGameSounds(){

  if(voice.ui)continue;
  try{voice.source.stop()}catch{}

}
function positionSoundVoice(voice,immediate=false){
 if(!voice.actor||!S)return;
 const dx=voice.actor.x-S.p.x,dy=voice.actor.y-S.p.y;
 const distance=Math.hypot(dx,dy);
 const volume=voice.uniformVolume?voice.level:
  voice.level*Math.pow(clamp(1-distance/13,0,1),2);
 const pan=clamp((dx-dy)/(13*Math.SQRT2),-.95,.95);
 if(immediate){
  voice.gain.gain.value=volume;
  if(voice.pan)voice.pan.pan.value=pan;
 }else{
  voice.gain.gain.setTargetAtTime(volume,audio.currentTime,.025);
  if(voice.pan)voice.pan.pan.setTargetAtTime(pan,audio.currentTime,.025);
 }
}
function playWav(name,{volume=1,rate=1,actor=null,step=false}={}){
 if(!soundReady||!audio||audio.state!=="running"||
    !S||S.dead||paused||document.hidden||!document.hasFocus()||
    soundLevel("volume",.15)===0)return;
 const uniformVolume=name==="barrel_explosion"||SHOT_SOUNDS.includes(name);
 if(actor&&!uniformVolume&&dist(actor,S.p)>=13)return;
 if(soundVoices.size>=40||(actor&&soundVoices.size>=24))return;
 const variants=soundVariants.get(name);
 if(!variants?.length)return;
 const entry=variants[Math.floor(soundRandom()*variants.length)];
 const source=audio.createBufferSource(),gain=audio.createGain();
 const nodes=[source,gain];
 source.buffer=entry.buffer;
 source.playbackRate.value=clamp(rate,.65,1.4);
 gain.gain.value=volume;
 source.connect(gain);
 let output=gain,pan=null;
 if(step&&!actor){
  // Сохраняем шорох земли и короткую атаку дорожного шага.
  const road=name==="player_step_road"||name==="step_road";
  const filter=audio.createBiquadFilter();
  filter.type="lowpass";
  filter.frequency.value=road?3200:6500;
  filter.Q.value=.5;
  output.connect(filter);output=filter;nodes.push(filter);
  const now=audio.currentTime;
  const duration=entry.buffer.duration/source.playbackRate.value;
  const attack=Math.min(road?.003:.006,duration*.2);
  const release=Math.min(.035,duration*.25);
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(volume,now+attack);
  gain.gain.setValueAtTime(volume,now+duration-release);
  gain.gain.linearRampToValueAtTime(0,now+duration);
 }
 if(actor){
  const filter=audio.createBiquadFilter();
  filter.type="lowpass";
  const clear=uniformVolume||lineClear(S.p,actor);
  filter.frequency.value=clear?6500:1100;
  output.connect(filter);output=filter;nodes.push(filter);
  if(!clear)volume*=.4;
  if(typeof audio.createStereoPanner==="function"){
   pan=audio.createStereoPanner();
   output.connect(pan);output=pan;nodes.push(pan);
  }
 }
 output.connect(step?soundSteps:soundEffects);
 const voice={source,gain,pan,nodes,actor,level:volume,uniformVolume,ui:false};
 positionSoundVoice(voice,true);
 soundVoices.add(voice);
 source.onended=()=>releaseSoundVoice(voice);
 source.start();
}

function soundFootstep(actor,moved){

 if(footstepMap!==S.map){
  footstepMap=S.map;
  footstepStates=new WeakMap();
 }
 let state=footstepStates.get(actor);
 if(!state){
  state={distance:actor===S.p?0:soundRandom()*.6,side:0};
  footstepStates.set(actor,state);
 }
 state.distance+=moved;
 // Два шага на цикл существующей анимации ног.
 const stride=Math.PI/4.8;
 if(state.distance<stride)return;
 state.distance%=stride;
 state.side=1-state.side;
 const player=actor===S.p;
 if(!player&&dist(actor,S.p)>=13)return;
 const terrain=S.map.terrain?.[Math.floor(actor.y)*S.map.n+Math.floor(actor.x)]||0;
 const stepName=terrain===1||terrain===2?"step_road":"step_sand";
 playWav(player?"player_"+stepName:stepName,{
  volume:player?(S.p.sprinting?.64:.44)*(stepName==="step_road"?1.2:1):.95,
  rate:(player?1:actor.type===1?.8:1.02)+(state.side?.035:-.035),
  actor:player?null:actor,
  step:true
 });
}
function syncSound(){

 soundTarget(soundEffects,soundLevel("effects",.85));
 soundTarget(soundSteps,soundLevel("steps",.8));
 soundTarget(soundAmbient,
  audible?.3*(paused?.4:1):0,.35);
 if(paused||!S||S.dead||!audible)stopGameSounds();
 else for(const voice of soundVoices){
  if(voice.actor){
   if(voice.actor.hp<=0){
    try{voice.source.stop()}catch{}
    releaseSoundVoice(voice);
   }else positionSoundVoice(voice);

  const entry=soundBank.get("ambience_0");
  if(entry){
   ambientSource=audio.createBufferSource();

   ambientSource.loop=true;
   ambientSource.connect(soundAmbient);

}

async function playButtonClick(){
 if(document.hidden||!document.hasFocus()||soundLevel("volume",.15)===0)return;
 const requested=performance.now();
 let oscillator=null,gain=null,filter=null,voice=null;
 try{
  // Не ждём синтеза всего банка: щелчок создаётся непосредственно.
  void unlockSound();
  if(!audio||!soundMaster)return;
  if(audio.state==="suspended")await audio.resume();
  if(audio.state!=="running"||performance.now()-requested>300||
     document.hidden||!document.hasFocus()||
     soundLevel("volume",.15)===0||soundVoices.size>=40)return;
  syncSound();
  const now=audio.currentTime;
  oscillator=audio.createOscillator();
  gain=audio.createGain();
  filter=audio.createBiquadFilter();
  oscillator.type="triangle";
  oscillator.frequency.setValueAtTime(1250,now);
  oscillator.frequency.exponentialRampToValueAtTime(420,now+.045);
  filter.type="lowpass";
  filter.frequency.value=2200;
  filter.Q.value=.5;
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(.24,now+.002);
  gain.gain.exponentialRampToValueAtTime(.001,now+.045);
  gain.gain.linearRampToValueAtTime(0,now+.06);
  oscillator.connect(filter);
  filter.connect(gain);
  // Общая громкость действует и в меню, и до начала забега.
  gain.connect(soundMaster);
  voice={source:oscillator,nodes:[oscillator,filter,gain],ui:true};
  soundVoices.add(voice);
  oscillator.onended=()=>releaseSoundVoice(voice);
  oscillator.start(now);
  oscillator.stop(now+.065);
 }catch(error){
  if(oscillator){
   try{oscillator.stop()}catch{}
  }
  if(voice)releaseSoundVoice(voice);
  else for(const node of [oscillator,filter,gain])node?.disconnect();
  console.warn("Не удалось воспроизвести щелчок кнопки:",error);
 }
}

function selectKnifeTarget(hero,direction,enemies,clear){

 let target=null,best=Infinity;
 for(const e of enemies){
  if(!(e.hp>0))continue;
  const x=e.x-hero.x,y=e.y-hero.y,d=Math.hypot(x,y);
  if(!Number.isFinite(d)||d>KNIFE.range||d>=best)continue;
  if(d>1e-8&&(x*dx+y*dy)/d<KNIFE.coneCos)continue;
  if(!clear(hero,e))continue;
  target=e;best=d;

  if(!(o.hp>0))return false;
  const t=length2>0?clamp(((o.x-a.x)*dx+(o.y-a.y)*dy)/length2,0,1):0;
  return Math.hypot(o.x-a.x-dx*t,o.y-a.y-dy*t)<.3;

function updateCombatVisuals(dt){
 const state=getCombatVisuals();
 if(!state)return;
 state.time+=dt;
 updateKnifeAttack(state);
 let blastWrite=0;
 for(const blast of state.explosions){
  if(state.time-blast.born<blast.duration){
   state.explosions[blastWrite++]=blast;
  }
 }
 state.explosions.length=blastWrite;
 let dropWrite=0;
 for(const drop of state.bulletDrops){
  if(stepBulletDrop(drop,dt))state.bulletDrops[dropWrite++]=drop;
 }
 state.bulletDrops.length=dropWrite;
 let write=0;
 for(const f of state.particles){
  f.life-=dt;
  if(f.life<=0)continue;
  f.px=f.x;f.py=f.y;f.pz=f.z;
  if(f.z>0||f.vz>0){
   const nx=f.x+f.vx*dt,ny=f.y+f.vy*dt;
   if(wall(nx,ny)){
    f.vx*=-.25;f.vy*=-.25;
   }else{
    f.x=nx;f.y=ny;
   }
   f.vz-=160*dt;
   f.z+=f.vz*dt;
   f.angle+=f.spin*dt;
   if(f.z<=0){
    f.z=0;
    if((f.kind==="shell"||f.kind==="debris")&&!f.bounced){
     f.vz=Math.abs(f.vz)*.3;
     f.vx*=.45;f.vy*=.45;f.spin*=.5;
     f.bounced=true;
    }else{
     f.vx=0;f.vy=0;f.vz=0;f.spin=0;
     if(f.kind==="spark")f.life=0;
    }
   }
  }
  if(f.life>0)state.particles[write++]=f;
 }
 state.particles.length=write;
}

function patrolEnemy(e,t,dt){

 let state=enemyPatrolStates.get(e);
 if(!state){
  state={random:rng(hash(S.map.seed+":"+e.id+":patrol")),target:null,wait:0};
  enemyPatrolStates.set(e,state);
 }
 state.wait-=dt;
 if(!state.target){
  if(state.wait>0)return;
  const ix=Math.floor(e.x),iy=Math.floor(e.y);
  const options=DIRS.map(([dx,dy])=>({x:ix+dx+.5,y:iy+dy+.5}))
   .filter(p=>valid(p.x,p.y)&&lineClear(e,p)&&
    S.map.shops.every(s=>dist(s,p)>2.5));
  if(!options.length){state.wait=.5;return}
  state.target=pick(state.random,options);
 }

  state.target=null;

    S.map.shops.some(s=>Math.hypot(e.x+dx-s.x,e.y+dy-s.y)<2.3)){
  state.target=null;state.wait=.25;return;

function npcSpawnOutsideView(point,hero,width=W,height=H){

 // Запас учитывает увеличенный силуэт, оружие и тряску камеры.

  y < -margin || y > height+margin;

function updateNPCSpawns(elapsed){
 if(!S||paused||S.dead||S.between||!Number.isFinite(elapsed)||elapsed<=0)return;
 if(!Number.isFinite(S.npcSpawnClock)||S.npcSpawnClock<0)S.npcSpawnClock=0;
 if(!Number.isSafeInteger(S.npcSpawnWave)||S.npcSpawnWave<0)S.npcSpawnWave=0;
 S.npcSpawnClock+=elapsed;
 if(S.npcSpawnClock<CFG.npcSpawnSeconds)return;
 // После зависания вкладки не создаём сразу множество волн.
 S.npcSpawnClock%=CFG.npcSpawnSeconds;
 const r=rng(hash(S.map.seed+":reinforcements:"+(++S.npcSpawnWave)));
 const m=S.map,p=S.p;
 const reachable=distances(m,Math.floor(p.x),Math.floor(p.y));
 const candidates=[];
 for(let y=1;y<m.n-1;y++)for(let x=1;x<m.n-1;x++){
  if(reachable[y*m.n+x]<0)continue;
  const point={x:x+.5,y:y+.5};
  if(!npcSpawnOutsideView(point,p)||dist(point,p)<=8||
     !valid(point.x,point.y,.3)||dist(point,m.exit)<=3||
     m.shops.some(s=>dist(s,point)<=3)||
     (m.landmarks||[]).some(s=>dist(s,point)<=3)||
     S.props.some(o=>o.hp>0&&dist(o,point)<.8)||
     S.loot.some(o=>dist(o,point)<.8)||
     S.enemies.some(e=>e.hp>0&&dist(e,point)<1))continue;
  candidates.push(point);
 }
 const spots=[];
 for(const point of shuffle(r,candidates)){
  if(spots.every(other=>dist(other,point)>=1.5))spots.push(point);
  if(spots.length===CFG.npcSpawnCount)break;
 }
 // Нельзя заменить скрытый спавн появлением на глазах игрока.
 if(spots.length<CFG.npcSpawnCount)return;
 const pool=levelEnemyPool(r);

  x:((x-e.x)-(y-e.y))*32/scale,
  y:(((x-e.x)+(y-e.y))*16-19)/scale
 });
 const start=local(ox,oy),end=local(b.x,b.y);
 const padding=1.5/scale;
 // Быстрая проверка до построения подробного силуэта.
 if(Math.max(start.x,end.x)<-70-padding||
    Math.min(start.x,end.x)>70+padding||
    Math.max(start.y,end.y)<-80-padding||
    Math.min(start.y,end.y)>45+padding)return Infinity;

    cached.mode!==mode||cached.weapon!==e.weapon){

   frame:npcHitFrame,angle:e.angle,mode,path:npcHitPath(e),

  if(npcHitContext.isPointInPath(cached.path,x,y)||
     npcHitContext.isPointInStroke(cached.path,x,y)||

function stats(w, reference) {
  if(!w)return knifeStats();
  const rarity = RARITY[w.rare];
  const weaponClass = CLASSES[w.ci];

  const format = (value, digits = 0) =>
    Number(value).toLocaleString("ru-RU", {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    });

  function row(
    label,
    value,
    other,
    {
      digits = 0,
      unit = "",
      lowerBetter = false
    } = {}
  ) {
    let badge = "";

    if (reference && Number.isFinite(other)) {
      // Сравниваем с той же точностью, с которой показываем значения.
      // Так не появится плюс при визуально одинаковых числах.
      const currentShown = Number(value.toFixed(digits));
      const otherShown = Number(other.toFixed(digits));
      const difference = Number(
        (currentShown - otherShown).toFixed(digits)
      );

      if (difference === 0) {
        badge = `
          <span class="weapon-diff weapon-diff--equal"
                title="Одинаково">=</span>
        `;
      } else {
        const better = lowerBetter
          ? difference < 0
          : difference > 0;

        const symbol = better ? "+" : "−";
        const css = better ? "better" : "worse";
        const verdict = better ? "Лучше" : "Хуже";
        const direction = difference > 0 ? "больше" : "меньше";
        const amount = format(Math.abs(difference), digits);

        badge = `
          <span
            class="weapon-diff weapon-diff--${css}"
            title="${verdict}: на ${amount}${unit ? " " + unit : ""} ${direction}"
          >${symbol} ${amount}${unit ? " " + unit : ""}</span>
        `;
      }
    }

    return `
      <div class="weapon-stat">
        <span>${label}</span>
        <span class="weapon-stat__value">
          ${format(value, digits)}${unit ? " " + unit : ""}
          ${badge}
        </span>
      </div>
    `;
  }

  const other = reference;
  const degrees = value => value * 180 / Math.PI;

  const effectComparison = other
    ? (
        w.effect === other.effect
          ? `<br><span class="small">Эффект совпадает.</span>`
          : `<br><span class="small">
               У другого оружия: ${EFFECTS[other.effect].name}.
               Разные эффекты — выбор под вашу сборку.
             </span>`
      )
    : "";

  return `
    <h3 style="color:${rarity.color}">${w.name}</h3>
    ${weaponPreview(w)}
    <div class="small">Отделка: ${weaponArt(w).name}</div>

    <span class="tag">${rarity.name}</span>
    <span class="tag">
      Ур. ${w.level} · ${weaponClass.name}
    </span>

    <p class="small">
      ${MAKERS[w.mi].name} · ${w.material}<br>
      Ствол: ${BARRELS[w.bi].name}<br>
      Магазин: ${MAGS[w.gi].name}
    </p>

    ${row(
      "Урон одного снаряда",
      w.damage,
      other?.damage
    )}

    ${row(
      "Снарядов за выстрел",
      w.pellets,
      other?.pellets
    )}

    ${row(
      "Темп стрельбы",
      w.rate,
      other?.rate,
      { digits: 1, unit: "/с" }
    )}

    ${row(
      "Размер магазина",
      w.mag,
      other?.mag
    )}

    ${row(
      "Перезарядка ↓",
      w.reload,
      other?.reload,
      { digits: 2, unit: "с", lowerBetter: true }
    )}

    ${row(
      "Разброс ↓",
      degrees(w.spread),
      other ? degrees(other.spread) : undefined,
      { digits: 1, unit: "°", lowerBetter: true }
    )}

    ${row(
      "Дальность",
      w.range,
      other?.range,
      { digits: 1 }
    )}

    ${row(
      "Скорость снаряда",
      w.speed,
      other?.speed,
      { digits: 1 }
    )}

    ${row(
  "Шанс крита, %",
  w.crit * 100,
  other ? other.crit * 100 : undefined,
  { digits: 1 }
)}

    ${row(
      "Множитель крита",
      w.critPower,
      other?.critPower,
      { digits: 2, unit: "×" }
    )}

    ${row(
      "Рикошеты",
      w.effect === 3 ? 1 : 0,
      other ? (other.effect === 3 ? 1 : 0) : undefined
    )}

    <div class="weapon-effect">
      <b>Особое свойство:</b> ${EFFECTS[w.effect].name}
      ${effectComparison}
    </div>

    <p class="small" style="margin-top:8px">
      ${
        other
          ? "Знаки показывают преимущество этой карточки относительно другой. ↓ — меньше лучше."
          : "Параметры оружия без бонусов героя."
      }
    </p>
  `;
}

function weaponShopWindow(sh){

   const stockRandom=rng(hash(S.map.seed+":"+sh.x+":"+sh.y+":shop-stock:v1"));
   const usedSeeds=new Set(sh.items.map(w=>w.seed));
   while(sh.items.length<5){

    while(usedSeeds.has(seed))seed=(seed+1)>>>0;
    usedSeeds.add(seed);
    sh.items.push(weapon(seed,S.level));
   }
  }
  sh.stockVersion=1;
  save();
 }

const minimapCache=new WeakMap();
function drawMinimap(){
 const m=S.map,scale=Math.min(4,150/m.n),size=m.n*scale,x0=W-size-18,y0=18;
 let cached=minimapCache.get(m);
 if(!cached){
  const surface=document.createElement("canvas");
  surface.width=surface.height=m.n;
  cached={surface,context:surface.getContext("2d"),updated:-Infinity};
  minimapCache.set(m,cached);
 }
 const now=performance.now();
 if(now-cached.updated>=200){
  const c=cached.context;
  c.clearRect(0,0,m.n,m.n);
  for(let y=0;y<m.n;y++)for(let x=0;x<m.n;x++)if(m.seen[y*m.n+x]){
   c.fillStyle=m.tiles[y*m.n+x]?"#91a1bd":"#d2e8f2";
   c.fillRect(x,y,1,1);
  }
  cached.updated=now;
 }
 ctx.fillStyle="#ffffffca";ctx.fillRect(x0-7,y0-7,size+14,size+14);
 ctx.save();
 ctx.imageSmoothingEnabled=false;
 ctx.drawImage(cached.surface,x0,y0,size,size);
 ctx.restore();
 const dot=(p,color,r=2)=>{
  if(m.seen[Math.floor(p.y)*m.n+Math.floor(p.x)]){
   ctx.fillStyle=color;ctx.fillRect(x0+p.x*scale-r,y0+p.y*scale-r,r*2,r*2);
  }
 };
 dot(m.exit,"#ad3ecd",3);m.shops.forEach(s=>dot(s,"#4daf57"));
 dot(S.p,"#ed447d",3);
}

function testBulletDrops(){
 const results=[];
 const check=(name,ok)=>results.push({name,ok:Boolean(ok)});
 const fresh=()=>({x:3,y:4,z:19,age:0,enemy:false});
 const drop=fresh();
 stepBulletDrop(drop,.08);
 check("За половину падения пуля опускается, но ещё не достигает земли",
  Math.abs(drop.z-14.25)<1e-9);
 stepBulletDrop(drop,.08);
 check("Через 0,16 с пуля на земле; урон отсутствует",
  drop.z===0&&!Object.hasOwn(drop,"damage"));
 const alive=stepBulletDrop(drop,.09);
 check("Испарение продолжается после касания земли",alive&&drop.z===0);
 check("После 0,34 с эффект удаляется",
  !stepBulletDrop(drop,.10)&&drop.z===0);
 check("Падение не продлевает горизонтальную дальность",drop.x===3&&drop.y===4);

 for(const fps of [30,60,144]){
  const f=fresh();
  let previous=f.z,monotonic=true,active=true;
  for(let i=0;i<Math.ceil(.4*fps);i++){
   active=stepBulletDrop(f,1/fps);
   if(f.z>previous||f.z<0)monotonic=false;
   previous=f.z;
  }
  check(`Падение и удаление при ${fps} FPS`,monotonic&&!active&&f.z===0);
 }
 const idle=fresh(),before=JSON.stringify(idle);
 for(const dt of [0,-1,NaN,Infinity])stepBulletDrop(idle,dt);
 check("Пауза и некорректное время не меняют эффект",JSON.stringify(idle)===before);
 return results;
}
function testInventoryTransfers(){
 const results=[];
 const check=(name,ok)=>results.push({name,ok:Boolean(ok)});
 const first=weapon(101,1),second=weapon(102,1),found=weapon(103,1);
 first.ammo=1;
 first.reserve=3;
 const item={x:3,y:4,w:found};
 const state={
  dead:false,loot:[item],
  p:{x:0,y:0,slot:0,weapons:[first,second],reload:1,shot:0}
 };
 check("Подбор ровно в радиусе 5 м",
  transferFloorWeapon(state,item,0)&&state.p.weapons[0]===found);
 check("Прежнее оружие лежит у ног без потери патронов",
  state.loot.length===1&&state.loot[0].w===first&&
  state.loot[0].x===0&&state.loot[0].y===0&&first.ammo===1&&first.reserve===3);
 check("Повторный подбор того же предмета запрещён",
  !transferFloorWeapon(state,item,1)&&state.p.weapons[1]===second);
 check("Смена оружия отменяет перезарядку",state.p.reload===0);
 const far={x:5.01,y:0,w:weapon(104,1)};
 state.loot.push(far);
 check("За пределами 5 м подбор запрещён",!transferFloorWeapon(state,far,0));
 check("Можно освободить обе руки",
  dropHandWeapon(state,0)&&dropHandWeapon(state,1)&&
  state.p.weapons.every(w=>w===null));
 const count=state.loot.length;
 check("Повторное выбрасывание не создаёт дубликат",
  !dropHandWeapon(state,0)&&state.loot.length===count);
 const restored=JSON.parse(JSON.stringify(state));
 check("Два пустых слота сохраняются в JSON",
  restored.p.weapons.length===2&&restored.p.weapons.every(w=>w===null));
 const nearby=restored.loot.find(o=>dist(o,restored.p)<=INVENTORY_RADIUS);
 check("После загрузки можно снова вооружиться",
  transferFloorWeapon(restored,nearby,1)&&restored.p.weapons[1]===nearby.w);
 check("Несуществующий слот отклоняется",!dropHandWeapon(restored,2));
 return results;
}
function testKnife(){
 const results=[],hero={x:0,y:0},direction={x:1,y:0};
 const check=(name,ok)=>results.push({name,ok:Boolean(ok)});
 const enemy=(x,y,hp=100)=>({x,y,hp});
 const front=enemy(.8,0),back=enemy(-.4,0),side=enemy(0,.5);
 const choose=(enemies,clear=()=>true)=>
  selectKnifeTarget(hero,direction,enemies,clear);
 check("Урон ножа — ровно 50 HP",KNIFE.damage===50);
 check("Цель впереди доступна",choose([front])===front);
 check("Сзади и сбоку укол не попадает",choose([back,side])===null);
 const edge=enemy(KNIFE.range,0);
 check("Граница дальности включена",choose([edge])===edge);
 check("За пределами дальности промах",
  choose([enemy(KNIFE.range+.001,0)])===null);
 check("Стена блокирует укол",choose([front],()=>false)===null);
 const near=enemy(.4,0);
 check("Выбирается только ближайший живой NPC",
  choose([front,enemy(.2,0,0),near])===near);
 check("Мёртвые цели пропускаются",choose([enemy(.2,0,0)])===null);
 check("Некорректное направление отклоняется",
  selectKnifeTarget(hero,{x:0,y:0},[front],()=>true)===null);
 check("Попадание внутри анимации, интервал длиннее выпада",
  KNIFE.hitTime>0&&KNIFE.hitTime<KNIFE.duration&&KNIFE.duration<KNIFE.cooldown);
 return results;
}

function loadRun(){
 try{
  const raw=localStorage.getItem("prism-save");
  if(!raw){toast("Нет сохранённого забега");return}
  stopGameSounds();
  S=JSON.parse(raw);
  if(!S.map||!S.p||!validateMap(S.map))throw Error("Формат");
  normalizeStamina(S);
  normalizeArmor(S);
  if(!Array.isArray(S.p.weapons)||S.p.weapons.length!==2)throw Error("Слоты оружия");
  S.p.weapons=S.p.weapons.map(w=>w??null);
  if(S.p.slot!==0&&S.p.slot!==1)S.p.slot=0;
  if(!activeWeapon())S.p.reload=0;
  for(const e of S.enemies)equipEnemy(e);
  S.medkits=Array.isArray(S.medkits)?S.medkits.filter(m=>
   m&&Number.isFinite(m.x)&&Number.isFinite(m.y)&&!wall(m.x,m.y)
  ):[];
  S.p.heal=Number.isFinite(S.p.heal)
   ?clamp(S.p.heal,0,CFG.medkitSeconds):0;
  serial=Math.max(0,...S.enemies.map(e=>e.id));pathTimer=0;
  if(S.pending)caseWindow();else if(S.between)betweenWindow();else closeModal();
 }catch{toast("Не удалось загрузить сохранение")}
}

addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT")return;
 if(e.target instanceof Element&&e.target.closest("button")&&
    (e.code==="Space"||e.code==="Enter"))return;
 if(e.code==="Tab"&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.shiftKey){
  const inventoryOpen=paused&&$("#inventoryRoot")&&
   !$("#modal").classList.contains("hidden");
  if(S&&!S.dead&&!S.between&&(!paused||inventoryOpen)){
   e.preventDefault();
   if(!e.repeat){
    if(inventoryOpen)closeModal();
    else inventoryWindow();
   }
   return;
  }
 }
 if(["Space","KeyW","KeyA","KeyS","KeyD"].includes(e.code))e.preventDefault();
 if(e.repeat)return;
 keys[e.code]=true;
 if(e.code==="Escape"){
  if(paused&&S&&!S.dead&&!S.between)closeModal();else pauseWindow();
  return;
 }
 if(!S||paused)return;
 if(e.code==="KeyR")reload();
 if(e.code==="KeyQ")switchWeapon();
 if(e.code==="Digit1")switchWeapon(0);
 if(e.code==="Digit2")switchWeapon(1);
 if(e.code==="KeyE")interact();
});
addEventListener("keyup",e=>keys[e.code]=false);
canvas.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
canvas.addEventListener("mousedown",e=>{if(e.button===0&&!paused)mouse.down=true});
addEventListener("mouseup",()=>mouse.down=false);
canvas.addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("blur",()=>{keys={};mouse.down=false;if(S&&!paused)pauseWindow()});
document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
  keys={};mouse.down=false;
  if(S&&!paused)pauseWindow();
 }
 lastTime=performance.now();
});
addEventListener("beforeunload",()=>{if(S&&!S.dead)save()});
$("#pauseButton").onclick=pauseWindow;
function frame(now){
 const realDt=Math.max(0,(now-lastTime)/1000);lastTime=now;
 const dt=Math.min(.033,realDt);
 update(dt,realDt);syncSound();shake=Math.max(0,shake-dt*24);
 shotShake=Math.max(0,shotShake-dt*24);
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$("#toast").textContent=""}
 draw();requestAnimationFrame(frame);
}
menu();requestAnimationFrame(frame);

  max-width: min(590px, 72vw);
}

#hint {
  font-weight: bold;
}

h1, h2, h3 {
  text-transform: uppercase;
}

input {
  accent-color: #a56334;
}

<script>
/*
 * DUST RUN — дополнение к предыдущему PRISM RUN.
 * Подключается ПОСЛЕ основного скрипта.
 */
(() => {
  "use strict";

  document.title = "BORDOUT: New Cubics";

  // Настройки остаются доступны для изменения.
  CFG.baseEnemies = 30;
  CFG.maxEnemies = 58;
  CFG.weaponShopChance = .95;
  CFG.upgradeShopChance = .85;

  // Индексы сохраняются: существующая система выбора тем работает без изменений.
  THEMES.splice(0, THEMES.length,
    {
      name: "Выжженный тракт",
      sky: "#c9b48f",
      floor: "#c8ab76",
      alt: "#bda06d",
      wall: "#b3966c",
      edge: "#715943",
      accent: "#af6240",
      sand: "#c8ab76",
      road: "#897b64",
      wash: "#a48b61",
      roof: "#a76742",
      style: 0
    },
    {
      name: "Ржавое плато",
      sky: "#c9a689",
      floor: "#be976d",
      alt: "#b38c62",
      wall: "#b7a188",
      edge: "#725444",
      accent: "#728178",
      sand: "#be976d",
      road: "#827767",
      wash: "#9b7854",
      roof: "#865744",
      style: 1
    },
    {
      name: "Соляная окраина",
      sky: "#d4c7aa",
      floor: "#d2c4a0",
      alt: "#c6b691",
      wall: "#bca98b",
      edge: "#716758",
      accent: "#98734c",
      sand: "#d2c4a0",
      road: "#918a77",
      wash: "#ae9e7d",
      roof: "#7e8172",
      style: 2
    }
  );

  ENEMY_TYPES[0].name = "Дорожный налётчик";
  ENEMY_TYPES[0].color = "#a26445";
  ENEMY_TYPES[1].name = "Жестянщик";
  ENEMY_TYPES[1].color = "#777b68";
  ENEMY_TYPES[2].name = "Дозорный";
  ENEMY_TYPES[2].color = "#b79c66";

  // ---------------- Генерация открытой местности ----------------

  CFG.buildingSignFraction = .20;

  const BUILDING_STYLES = [
    {id:"adobe",name:"Глинобитный дом",roof:"flat",rise:0,height:39,
      facade:"plaster",door:"small",detail:"parapet",sign:""},
    {id:"shack",name:"Дощатая лачуга",roof:"shed",rise:14,height:32,
      facade:"boards",door:"small",detail:"none",sign:""},
    {id:"cottage",name:"Жилой дом",roof:"gable",rise:25,height:43,
      facade:"plaster",door:"small",detail:"chimney",sign:""},
    {id:"warehouse",name:"Склад",roof:"gable",rise:20,height:49,
      facade:"metal",door:"shutter",detail:"vents",sign:"СКЛАД"},
    {id:"container",name:"Контейнерный дом",roof:"flat",rise:0,height:31,
      facade:"metal",door:"double",detail:"none",sign:""},
    {id:"workshop",name:"Мастерская",roof:"shed",rise:12,height:42,
      facade:"boards",door:"shutter",detail:"pipes",sign:"РЕМОНТ"},
    {id:"relay",name:"Радиопост",roof:"flat",rise:0,height:45,
      facade:"plaster",door:"small",detail:"antenna",sign:"СВЯЗЬ"},
    {id:"pump",name:"Насосная",roof:"flat",rise:0,height:37,
      facade:"metal",door:"small",detail:"tank",sign:"ВОДА"}
  ];

  const BUILDING_TONES = [
    {wall:"#b6a07b",edge:"#79674f",roof:"#986449"},
    {wall:"#a49b83",edge:"#696959",roof:"#777b6b"},
    {wall:"#bcaa8c",edge:"#81705e",roof:"#927a62"},
    {wall:"#a78666",edge:"#705441",roof:"#8d5840"}
  ];
  const styledMaps = new WeakSet();

  function ensureBuildingStyles(map){
    if(styledMaps.has(map))return;
    const buildings=map.buildings||[];
    const r=rng(hash(map.seed+":architecture:v1"));
    let bag=[],changed=false;

    for(const b of buildings){
      if(!bag.length)bag=shuffle(r,BUILDING_STYLES.map(s=>s.id));
      const type=bag.pop();
      const tone=Math.floor(r()*BUILDING_TONES.length);
      const boarded=r()<.4;
      const heightOffset=Math.floor(r()*10);

      if(b.arch&&BUILDING_STYLES.some(s=>s.id===b.arch.type))continue;
      const style=BUILDING_STYLES.find(s=>s.id===type);
      b.arch={type,tone,boarded,sign:false};
      b.height=style.height+heightOffset;
      changed=true;
    }

    if(changed){
      for(const b of buildings)b.arch.sign=false;
      const candidates=shuffle(r,buildings.filter(b=>
        b.w>=3&&BUILDING_STYLES.find(s=>s.id===b.arch.type).sign
      ));
      const limit=Math.floor(buildings.length*CFG.buildingSignFraction);
      for(const b of candidates.slice(0,limit))b.arch.sign=true;
    }
    styledMaps.add(map);
  }

  const REGION_PROFILES=[
    {name:"Караванные дюны",density:.55,mode:0,decor:[0,2,4],special:[5,6,7]},
    {name:"Промышленный узел",density:1.65,mode:1,decor:[1,3,4],special:[8,9,10]},
    {name:"Высохший оазис",density:.9,mode:2,decor:[0,1,2],special:[11,12,13]},
    {name:"Разбитый пригород",density:2.2,mode:3,decor:[1,3,4],special:[14,15,16]}
  ];

  generateMap = function(seed, level) {
    const r = rng(seed);
    // Прежняя стартовая карта: 159×159. Меняем площадь, не масштаб клетки.
    const previousStartSize=Math.round(Math.round(65*Math.SQRT2)*Math.sqrt(3));
    const n = Math.round(previousStartSize*Math.sqrt(.2*Math.pow(1.03,level-1)));
    // Профили соседних уровней различаются независимо от случайного seed.
    const profile=REGION_PROFILES[(level-1)%REGION_PROFILES.length];
    const layout={
      name:profile.name,mode:profile.mode,
      density:profile.density*(.92+r()*.16),
      angle:r()*Math.PI*2,
      phase:r()*Math.PI*2,
      offset:(r()-.5)*n*.16,
      width:2.5+r()*2
    };
    const ca=Math.cos(layout.angle),sa=Math.sin(layout.angle);
    const settlements=Array.from({length:3},()=>({
      x:n*(.2+r()*.6),y:n*(.2+r()*.6)
    }));

    const map = {
      seed,
      n,
      tiles: Array(n * n).fill(0),
      seen: Array(n * n).fill(false),
      buildings: [],
      decor: [],
      terrain: Array(n * n).fill(0),
      start: { x: 2.5, y: 2.5 },
      shops: [],
      desert: true,
      layout,
      landmarks: []
    };

    // Неровная на вид, но непрерывная внешняя граница.
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        if (x === 0 || y === 0 || x === n - 1 || y === n - 1) {
          map.tiles[y * n + x] = 1;
        }

        // Поворот, изгибы и схема дорог меняются вместе с регионом.
        const dx=x-n/2,dy=y-n/2;
        const u=dx*ca-dy*sa,v=dx*sa+dy*ca;
        const wave=Math.sin(u*.06+layout.phase)*n*.045;
        let road1,road2,wash;
        if(layout.mode===0){
          road1=Math.abs(v-wave-layout.offset);
          road2=n;
          wash=Math.abs(v+wave+n*.23);
        }else if(layout.mode===1){
          road1=Math.abs(v-layout.offset);
          road2=Math.abs(u+Math.sin(v*.045+layout.phase)*8);
          wash=Math.abs(v-u*.4+n*.3);
        }else if(layout.mode===2){
          road1=Math.abs(Math.hypot(u,v)-n*.27);
          road2=Math.abs(v-wave);
          wash=Math.hypot(u,v)<n*.19?0:n;
        }else{
          road1=Math.abs(((v+n*2)%(n*.19))-n*.095);
          road2=Math.abs(((u+n*2)%(n*.23))-n*.115);
          wash=Math.abs(v-u*.6-layout.offset);
        }
        if(wash<5)map.terrain[y*n+x]=3;
        if(road1<layout.width)map.terrain[y*n+x]=1;
        if(road2<layout.width)map.terrain[y*n+x]=2;
      }
    }

    // Отдельные компактные здания, а не сплошные стены лабиринта.
    // Между зданиями оставляем минимум несколько клеток.
    const targetBuildings = Math.min(340,
      Math.round((n*n/210+Math.min(level,100)*.5)*layout.density));

    for (let attempt = 0;
      attempt < 4500 && map.buildings.length < targetBuildings;
      attempt++) {

      const w = 2 + Math.floor(r() * 4);
      const h = 2 + Math.floor(r() * 3);
      let x = 7 + Math.floor(r() * (n - w - 12));
      let y = 7 + Math.floor(r() * (n - h - 12));
      if(layout.mode===0||layout.mode===2){
        const center=pick(r,settlements);
        x=clamp(Math.floor(center.x+(r()-.5)*n*.25),7,n-w-7);
        y=clamp(Math.floor(center.y+(r()-.5)*n*.25),7,n-h-7);
      }

      let fits = true;

      for (let yy = y - 3; yy < y + h + 3 && fits; yy++) {
        for (let xx = x - 3; xx < x + w + 3; xx++) {
          const k = yy * n + xx;

          if (
            xx < 1 || yy < 1 || xx >= n - 1 || yy >= n - 1 ||
            map.tiles[k] || map.terrain[k] === 1 || map.terrain[k] === 2
          ) {
            fits = false;
            break;
          }
        }
      }

      if (!fits) continue;

      const building = {
        x: x + w / 2,
        y: y + h / 2,
        w,
        h,
        height: 37 + Math.floor(r() * 34),
        kind: Math.floor(r() * 3),
        sign: pick(r, ["МОТЕЛЬ", "МАСЛО", "СКЛАД", "ВОДА", "ДЕПО"]),
        variant: r()
      };

      map.buildings.push(building);

      for (let yy = y; yy < y + h; yy++) {
        for (let xx = x; xx < x + w; xx++) {
          map.tiles[yy * n + xx] = 1;
        }
      }
    }

    // shopClear проверяет свободную площадку 5×5, включая отступ от границы.
    const spawnSpots = [];
    for (let y = 3; y < n - 3; y++) {
      for (let x = 3; x < n - 3; x++) {
        const p = { x: x + .5, y: y + .5 };
        const edge=Math.min(p.x,p.y,n-p.x,n-p.y);
        if(edge<=n*.15&&dist(p,{x:n/2,y:n/2})>=n*.4&&shopClear(p)){
          spawnSpots.push(p);
        }
      }
    }
    if (!spawnSpots.length) throw Error("Нет свободной площадки для старта");
    map.start = { ...pick(r, spawnSpots) };

    // Расстояния и достижимость считаются от фактического старта.
    const d = distances(map, Math.floor(map.start.x), Math.floor(map.start.y));
    const floors = [];

    for (let y = 1; y < n - 1; y++) {
      for (let x = 1; x < n - 1; x++) {
        if (d[y * n + x] >= 0) {
          floors.push({
            x: x + .5,
            y: y + .5,
            d: d[y * n + x]
          });
        }
      }
    }

    floors.sort((a, b) => b.d - a.d);
    const clearFloors = floors.filter(shopClear);
    const exitSpots = clearFloors.filter(p => dist(p, map.start) >= n * .7);
    if(!exitSpots.length)throw Error("Нет дальней площадки для эвакуации");
    // Сначала выбираем направление, затем точку: большие сектора не доминируют.
    const sectors=Array.from({length:8},()=>[]);
    for(const p of exitSpots){
      const angle=Math.atan2(p.y-map.start.y,p.x-map.start.x)+Math.PI;
      const sector=Math.floor(angle/(Math.PI*2)*8)%8;
      sectors[sector].push(p);
    }
    map.exit={...pick(r,pick(r,sectors.filter(s=>s.length)))};

    // Старту, эвакуации и магазинам нужны свободные площадки.
    function shopClear(p) {
      const x = Math.floor(p.x);
      const y = Math.floor(p.y);

      for (let yy = y - 2; yy <= y + 2; yy++) {
        for (let xx = x - 2; xx <= x + 2; xx++) {
          if (
            xx <= 0 || yy <= 0 || xx >= n - 1 || yy >= n - 1 ||
            map.tiles[yy * n + xx]
          ) return false;
        }
      }

      return true;
    }

    const candidates = shuffle(
      r,
      floors.filter(p =>
        p.d > 15 &&
        p.d < floors[0].d * .85 &&
        dist(p, map.exit) > 9 &&
        shopClear(p)
      )
    );

    if (r() < CFG.weaponShopChance && candidates.length) {
      map.shops.push({ ...candidates.shift(), kind: "weapons" });
    }

    if (r() < CFG.upgradeShopChance) {
      const p = candidates.find(p =>
        map.shops.every(s => dist(s, p) > 15)
      );

      if (p) map.shops.push({ ...p, kind: "upgrades" });
    }

    // Три гарантированных объекта разных типов, далеко друг от друга.
    const landmarkSpots=shuffle(r,clearFloors.filter(p=>
      dist(p,map.start)>10&&dist(p,map.exit)>10&&
      map.shops.every(s=>dist(s,p)>8)
    ));
    for(const kind of profile.special){
      const p=landmarkSpots.find(p=>map.landmarks.every(o=>dist(o,p)>12));
      if(!p)throw Error("Нет площадки для тематического объекта");
      map.landmarks.push({
        x:p.x,y:p.y,kind,size:1.5+r()*.5,flip:1,
        label:`${level}-${map.landmarks.length+1}`,
        variant:Math.floor(r()*3)
      });
    }

    // Декор не блокирует движение: визуальные камни и обломки.
    // Настоящие укрытия — здания и разрушаемые объекты основной игры.
    const decorationSpots = shuffle(
      r,
      floors.filter(p =>
        dist(p, map.start) > 4 &&
        dist(p, map.exit) > 3 &&
        map.shops.every(s => dist(s, p) > 3) &&
        map.landmarks.every(s => dist(s, p) > 3) &&
        map.terrain[Math.floor(p.y)*n+Math.floor(p.x)] !== 1
      )
    );

    const decorCount=Math.min(2600,Math.round(n*n*.035*layout.density));
    for (let i = 0; i < Math.min(decorCount, decorationSpots.length); i++) {
      const p = decorationSpots[i];

      map.decor.push({
        x: p.x + (r() - .5) * .3,
        y: p.y + (r() - .5) * .3,
        kind: pick(r,profile.decor),
        size: .7 + r() * .7,
        flip: r() > .5 ? 1 : -1
      });
    }

    ensureBuildingStyles(map);
    map.floors = floors;
    return map;
  };

  // ---------------- Вспомогательная графика ----------------

  function ink(points, fill, width = 2) {
    ctx.beginPath();
    points.forEach((p, i) =>
      i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)
    );
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = "#342c25";
    ctx.lineWidth = width;
    ctx.stroke();
  }

  function strokeLine(x1, y1, x2, y2, color, width = 2) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function visible(x, y, margin = 150) {
    const p = project(x, y),zoom=CFG.cameraZoom;
    const screenX=W/2+(p.x-W/2)*zoom;
    const screenY=H/2+(p.y-H/2)*zoom;
    const padding=margin*zoom;
    return screenX > -padding && screenX < W + padding &&
      screenY > -padding && screenY < H + padding;
  }

  function drawBuilding(b, theme) {
    const style=BUILDING_STYLES.find(s=>s.id===b.arch?.type)||BUILDING_STYLES[0];
    const tone=BUILDING_TONES[b.arch?.tone]||BUILDING_TONES[0];
    const point=(u,v,z=0)=>project(
      b.x-b.w/2+b.w*u,
      b.y-b.h/2+b.h*v,
      z
    );
    const roofHeight=v=>b.height+(
      style.roof==="gable"?style.rise*(1-Math.abs(v*2-1)):
      style.roof==="shed"?style.rise*(1-v):0
    );
    const roofPoint=(u,v)=>point(u,v,roofHeight(v));
    const a = project(b.x - b.w / 2, b.y - b.h / 2);
    const c = project(b.x + b.w / 2, b.y + b.h / 2);
    const right = project(b.x + b.w / 2, b.y - b.h / 2);
    const left = project(b.x - b.w / 2, b.y + b.h / 2);

    const up = p => ({ x: p.x, y: p.y - b.height });
    const pp = project(S.p.x, S.p.y);

    const minX = Math.min(a.x, c.x, left.x, right.x);
    const maxX = Math.max(a.x, c.x, left.x, right.x);

    // Грубая проверка перекрытия игрока экранным силуэтом здания.
    const blocksPlayer =
      pp.x > minX - 12 && pp.x < maxX + 12 &&
      pp.y - 15 > a.y - b.height - style.rise - 45 && pp.y - 15 < c.y &&
      S.p.x + S.p.y < b.x + b.y + (b.w + b.h) / 2;

    ctx.save();
    if (blocksPlayer) ctx.globalAlpha = .27;

    // Тень.
    poly([
      left, c,
      { x: c.x + 35, y: c.y + 13 },
      { x: left.x + 35, y: left.y + 13 }
    ], "#45382435");

    ink([right, c, up(c), up(right)], tone.edge);
    ink([c, left, up(left), up(c)], tone.wall);

    if(style.roof==="gable"){
      // Торцевой фронтон и два ската с общим коньком.
      ink([up(right),up(c),roofPoint(1,.5)],tone.wall);
      ink([
        roofPoint(0,0),roofPoint(1,0),
        roofPoint(1,.5),roofPoint(0,.5)
      ],tone.roof,2.5);
      ink([
        roofPoint(0,.5),roofPoint(1,.5),
        roofPoint(1,1),roofPoint(0,1)
      ],theme.edge,2.5);
    }else{
      if(style.roof==="shed"){
        ink([up(right),up(c),roofPoint(1,0)],tone.edge);
      }
      ink([
        roofPoint(0,0),roofPoint(1,0),
        roofPoint(1,1),roofPoint(0,1)
      ],tone.roof,2.5);
    }

    // Швы повторяют реальную форму крыши, включая конёк.
    if(style.detail!=="parapet"){
      for(let i=1;i<b.w*3;i++){
        const u=i/(b.w*3);
        const p1=roofPoint(u,0),pm=roofPoint(u,.5),p2=roofPoint(u,1);
        strokeLine(p1.x,p1.y,pm.x,pm.y,"#342c254f",1);
        strokeLine(pm.x,pm.y,p2.x,p2.y,"#342c254f",1);
      }
    }

    // Фактура переднего фасада: доски, гофра или штукатурка.
    if(style.facade==="boards"){
      for(let z=7;z<b.height;z+=8){
        const p1=point(0,1,z),p2=point(1,1,z);
        strokeLine(p1.x,p1.y,p2.x,p2.y,"#51402c70",1);
      }
    }else if(style.facade==="metal"){
      for(let i=1;i<b.w*5;i++){
        const u=i/(b.w*5);
        const p1=point(u,1,2),p2=point(u,1,b.height-2);
        strokeLine(p1.x,p1.y,p2.x,p2.y,"#3e3d3655",1);
      }
    }else{
      const crack=[point(.15,1,b.height*.8),point(.19,1,b.height*.55),point(.13,1,b.height*.35)];
      strokeLine(crack[0].x,crack[0].y,crack[1].x,crack[1].y,"#68564080",1);
      strokeLine(crack[1].x,crack[1].y,crack[2].x,crack[2].y,"#68564080",1);
    }

    // Все проёмы лежат в плоскости фасада, а не экрана.
    function facadePanel(u0,u1,z0,z1,color){
      ink([
        point(u0,1,z0),point(u1,1,z0),
        point(u1,1,z1),point(u0,1,z1)
      ],color,1.5);
    }

    const wide=style.door!=="small";
    const doorLeft=wide?.30:.44,doorRight=wide?.70:.56;
    const doorHeight=Math.min(b.height-7,wide?31:25);
    facadePanel(doorLeft,doorRight,0,doorHeight,
      style.door==="shutter"?"#727266":"#413b32");

    if(style.door==="shutter"){
      for(let z=5;z<doorHeight;z+=5){
        const p1=point(doorLeft,1,z),p2=point(doorRight,1,z);
        strokeLine(p1.x,p1.y,p2.x,p2.y,"#34372f",1);
      }
    }else if(style.door==="double"){
      const p1=point(.5,1,0),p2=point(.5,1,doorHeight);
      strokeLine(p1.x,p1.y,p2.x,p2.y,"#b3a58a",2);
      for(const u of [.35,.65]){
        const p3=point(u,1,3),p4=point(u,1,doorHeight-3);
        strokeLine(p3.x,p3.y,p4.x,p4.y,"#969480",2);
      }
    }

    for(const u of [.16,.78]){
      const bottom=b.height*.40,top=b.height*.72;
      facadePanel(u,u+.1,bottom,top,"#4c6260");
      if(b.arch?.boarded){
        const p1=point(u,1,bottom+2),p2=point(u+.1,1,top-2);
        const p3=point(u,1,top-2),p4=point(u+.1,1,bottom+2);

npcHitPath=function(a){
 const path=new Path2D(),t=ENEMY_TYPES[a.type];
 const behavior=enemyBehaviorStates.get(a);
 const mode=!a.boss&&behavior?.map===S?.map?behavior.mode:"";
 const sitting=mode==="sit",offset=sitting?13:0;
 const oval=(x,y,rx,ry)=>{
  path.moveTo(x+rx,y);
  path.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  path.closePath();
 };
 const polygon=points=>{
  // Единое направление обхода: перекрытия частей не создают дыр.
  let area=0;
  for(let i=0;i<points.length;i++){
   const p=points[i],q=points[(i+1)%points.length];
   area+=p[0]*q[1]-q[0]*p[1];
  }
  if(area<0)points=[...points].reverse();
  path.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++)path.lineTo(points[i][0],points[i][1]);
  path.closePath();
 };
 const rect=(x,y,w,h)=>polygon([[x,y],[x+w,y],[x+w,y+h],[x,y+h]]);
 const limb=(x1,y1,x2,y2,width)=>{
  const radius=width/2,dx=x2-x1,dy=y2-y1,length=Math.hypot(dx,dy);
  if(length>0){
   const nx=-dy/length*radius,ny=dx/length*radius;
   polygon([[x1+nx,y1+ny],[x2+nx,y2+ny],
    [x2-nx,y2-ny],[x1-nx,y1-ny]]);
  }
  oval(x1,y1,radius,radius);
  oval(x2,y2,radius,radius);
 };

 // Ноги используют ту же фазу и направление, что и отрисовка.
 const walk=actorWalkStates.get(a);
 const blend=walk?.blend||0,phase=walk?.phase||0;
 for(const side of [-1,1]){
  if(sitting){
   limb(side*4,0,side*13,-3,8);
   limb(side*13,-3,side*19,3,7);
   limb(side*17,3,side*23,3,5);
  }else{
   const legPhase=phase+(side===1?Math.PI:0);
   const swing=Math.sin(legPhase)*6*blend;
   const lift=Math.max(0,Math.cos(legPhase))*4*blend;
   const hipX=side*5;
   const footX=side*7+(walk?.dirX??1)*swing;
   const footY=(walk?.dirY??0)*swing-lift;
   const kneeX=hipX+(footX-hipX)*.55;
   const kneeY=-6+footY*.45-lift*.25;
   limb(hipX,-11,kneeX,kneeY,7);
   limb(kneeX,kneeY,footX,footY,6);
   limb(footX-2,footY,footX+3,footY,5);
  }
 }

 polygon([[-8,-29+offset],[8,-29+offset],[12,-8+offset],[-12,-8+offset]]);
 oval(0,-34+offset,8,9);
 if(t.shape===2){
  limb(-12,-42+offset,12,-42+offset,4);
  rect(-7,-49+offset,14,8);
 }else rect(-8,-43+offset,16,5);
 if(t.shape===1){
  polygon([[-14,-29+offset],[-5,-29+offset],[-7,-19+offset],[-16,-21+offset]]);
  polygon([[6,-29+offset],[14,-28+offset],[16,-21+offset],[7,-20+offset]]);
 }
 if(t.role===0)limb(-8,-30+offset,9,-28+offset,3);
 if(t.role===1)rect(-10,-44+offset,20,5);
 if(t.role===4)rect(-11,-28+offset,22,18);

 if(mode){
  const arm=(side,x,y)=>{
   limb(side*8,-25+offset,side*12,-18+offset,5);
   limb(side*12,-18+offset,x,y+offset,4);
   oval(x,y+offset,2.2,2.2);
  };
  const time=behavior.idleTime%20;
  if(mode==="smoke"){
   const lift=.5-.5*Math.cos(time*1.7);
   const x=12-8*lift,y=-17-15*lift;
   arm(1,x,y);arm(-1,-10,-12);
   limb(x,y+offset,x+6,y-1+offset,2);
  }else if(mode==="eat"){
   const take=clamp((time-.25)/1.1,0,1);
   const x=-10+4*take,y=-10-10*take;
   arm(-1,x,y+2);
   if(time>.25){
    rect(x-4,y-3+offset,8,9);
    oval(x,y-3+offset,4,2);
   }
   const bite=time<1.5?0:.5-.5*Math.cos((time-1.5)*2.8);
   const hx=8-6*bite,hy=-18-13*bite;
   arm(1,hx,hy);
   limb(hx,hy+offset,hx-3,hy-3+offset,1.5);
   oval(hx-3,hy-3+offset,1.5,1);
  }else{
   arm(-1,-12,-12);arm(1,12,-12);
  }
  if(!a.weapon){
   limb(-11,-27+offset,-15,-8+offset,4);
   limb(-11,-27+offset,-14,-12+offset,1.5);
  }
 }else if(!a.weapon){
  const angle=a.angle||0,dx=Math.cos(angle),dy=Math.sin(angle);
  const sx=(dx-dy)*32,sy=(dx+dy)*16;
  const length=Math.hypot(sx,sy)||1;
  const barrel=t.shape===2?30:21;
  const gx=sx/length*barrel,gy=sy/length*barrel;
  limb(4,-22,4+gx,-22+gy,6);
  limb(4,-24,4+gx,-24+gy,2);
 }
 if(a.boss){
  polygon([[-18,-35],[-8,-40],[-8,-19],[-19,-20]]);
 }
 return path;
};

function drawIdleHands(state,coat){

drawActor = function(a, player = false) {

    // Ноги: анимация зависит от фактического перемещения.
const now = performance.now() / 1000;

let walk = actorWalkStates.get(a);

if (!walk) {
  walk = {
    x: a.x,
    y: a.y,
    time: now,
    phase: 0,
    blend: 0,
    dirX: 1,
    dirY: 0
  };

  actorWalkStates.set(a, walk);
}

const dt = Math.min(.05, Math.max(0, now - walk.time));
const movedX = a.x - walk.x;
const movedY = a.y - walk.y;
const distance = Math.hypot(movedX, movedY);

// Большой скачок координат считаем телепортацией,
// а не обычным шагом.
const moving = !paused && distance > .0001 && distance < 1;

if (moving) {
  // Полный цикл примерно на каждые 1.3 клетки пути.
  walk.phase = (walk.phase + distance * 4.8) % (Math.PI * 2);

  // Преобразуем направление движения в экранное изометрическое.
  const screenX = (movedX - movedY) * 32;
  const screenY = (movedX + movedY) * 16;
  const screenLength = Math.hypot(screenX, screenY) || 1;

  const turnBlend = 1 - Math.exp(-18 * dt);

  walk.dirX += (screenX / screenLength - walk.dirX) * turnBlend;
  walk.dirY += (screenY / screenLength - walk.dirY) * turnBlend;
}

// Плавный переход между бегом и неподвижной стойкой.
// При паузе поза замирает.
if (!paused) {
  const targetBlend = moving ? 1 : 0;
  walk.blend +=
    (targetBlend - walk.blend) * (1 - Math.exp(-16 * dt));
}

walk.x = a.x;
walk.y = a.y;
walk.time = now;

const stride = 6 * walk.blend;

function drawLeg(side, phase) {
  const swing = Math.sin(phase) * stride;

  // Поднимаем стопу только на возвратной половине шага.
  const lift = Math.max(0, Math.cos(phase)) * 4 * walk.blend;

  const hipX = side * 5;
  const hipY = -11;

  const footX = side * 7 + walk.dirX * swing;
  const footY = walk.dirY * swing - lift;

  const kneeX = hipX + (footX - hipX) * .55;
  const kneeY = -6 + (footY * .45) - lift * .25;

  // Тёмный внешний контур.
  strokeLine(hipX, hipY, kneeX, kneeY, "#292820", 7);
  strokeLine(kneeX, kneeY, footX, footY, "#292820", 6);

  // Штанины.
  strokeLine(hipX, hipY, kneeX, kneeY, "#645c46", 4);
  strokeLine(kneeX, kneeY, footX, footY, "#4c493b", 3);

  // Ботинок.
  strokeLine(
    footX - 2,
    footY,
    footX + 3,
    footY,
    "#302d25",
    5
  );
}

ctx.lineCap = "round";

if(sitting){
 for(const side of [-1,1]){

 }
}else{
 // Ноги движутся в противофазе.
 drawLeg(-1, walk.phase);
 drawLeg(1, walk.phase + Math.PI);
}

ctx.restore();
    ctx.save();
