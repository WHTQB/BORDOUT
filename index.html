    ctx.fillStyle = "#514b3b";
    ctx.fillRect(-6, -25, 12, 13);
    strokeLine(-5, -23, 6, -12, "#c5ae7c", 2);

    if (!player && t.shape === 1) {
      // Тяжёлые наплечники.
      ink([
        { x: -14, y: -29 }, { x: -5, y: -29 },
        { x: -7, y: -19 }, { x: -16, y: -21 }
      ], "#858875", 2);
      ink([
        { x: 6, y: -29 }, { x: 14, y: -28 },
        { x: 16, y: -21 }, { x: 7, y: -20 }
      ], "#858875", 2);
    }

    // Голова и очки.
    ellipse(0, -34, 8, 9, "#c5ad7b");
    ctx.strokeStyle = "#302a23";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = player ? "#688a8b" : "#684935";
    ctx.fillRect(-7, -37, 14, 5);

    if (player || t.shape === 2) {
      strokeLine(-12, -42, 12, -42, "#514737", 4);
      ctx.fillStyle = "#695940";
      ctx.fillRect(-7, -49, 14, 8);
    } else {
      ctx.fillStyle = "#654f3e";
      ctx.fillRect(-8, -43, 16, 5);
    }

    if(!player&&t.role!==undefined){
      ctx.fillStyle=t.trim;
      ctx.fillRect(-5,-25,10,3);
      for(let i=0;i<=t.faction;i++){
        ctx.fillRect(-5+(i%3)*4,-19+Math.floor(i/3)*4,2,2);
      }
      if(t.role===0){
        strokeLine(-8,-30,9,-28,t.trim,3);
      }else if(t.role===1){
        ctx.fillStyle=t.trim;
        ctx.fillRect(-10,-44,20,5);
      }else if(t.role===2){
        for(let y=-24;y<-10;y+=4)strokeLine(7,y,10,y,"#d7b15e",2);
      }else if(t.role===4){
        ctx.fillStyle="#444b43";
        ctx.fillRect(-11,-28,22,18);
        strokeLine(-10,-22,10,-22,t.trim,3);
        strokeLine(0,-28,0,-11,t.trim,2);
      }else if(t.role===5){
        strokeLine(-7,-27,8,-12,"#d7b15e",4);
      }
    }
    drawActorStains(a);

    // Оружие следует направлению прицеливания.
    const angle = player
      ? Math.atan2(aim.y, aim.x)
      : (a.angle || 0);

    const v = project(a.x + Math.cos(angle), a.y + Math.sin(angle));
    let gx = v.x - p.x;
    let gy = v.y - p.y;
    const length = Math.hypot(gx, gy) || 1;

    gx /= length;
    gy /= length;

    if(player){
      const w=activeWeapon();
      if(w){
        drawWeaponSprite(w,4,-22,Math.atan2(gy,gx),.85);
        drawMuzzleVisual(a,gx,gy,weaponArt(w).muzzleLength*.85);
      }else{
        drawPlayerKnife(a);
      }
    }else if(idleMode){
      if(a.weapon)drawWeaponSprite(a.weapon,-11,-27,1.78,.55);
      drawIdleHands(leisure,coat);
    }else if(a.weapon){
      drawWeaponSprite(a.weapon,4,-22,Math.atan2(gy,gx),.85);
      drawMuzzleVisual(a,gx,gy,weaponArt(a.weapon).muzzleLength*.85);
    }

    if (boss) {
      ink([
        { x: -18, y: -35 }, { x: -8, y: -40 },
        { x: -8, y: -19 }, { x: -19, y: -20 }
      ], "#a06942", 2);
      text("III", 0, -15, 9, "#ddc493");
    }

    ctx.restore();
    ctx.restore();

    if (!player && a.hp < a.max) {
      const y = p.y - (boss ? 94 : 60);
      ctx.fillStyle = "#3e352c";
      ctx.fillRect(p.x - 21, y, 42, 5);
      ctx.fillStyle = "#b7553d";
      ctx.fillRect(p.x - 20, y + 1, 40 * a.hp / a.max, 3);
    }

    if (a.burn > 0) text("♨", p.x + 18, p.y - 30, 17, "#e36d24");
    if (a.slow > 0) text("❄", p.x - 18, p.y - 30, 16, "#79b9c1");
  };

  // ---------------- Полная отрисовка пустыни ----------------

  draw = function() {
    const theme = THEMES[S?.theme || 0];

    ctx.clearRect(0, 0, W, H);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, theme.sky);
    bg.addColorStop(1, theme.sand);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Графичный фон главного меню.
    if (!S) {
      ellipse(W * .76, H * .24, 65, 65, "#ead6a7");

      for (let layer = 0; layer < 3; layer++) {
        const points = [{ x: 0, y: H }];

        for (let x = 0; x <= W + 60; x += 60) {
          const y = H * (.48 + layer * .14) +
            Math.sin(x * .008 + layer) * 40 +
            Math.sin(x * .021 + layer * 4) * 22;

          points.push({ x, y });
        }

        points.push({ x: W + 60, y: H });
        poly(points, ["#998873", "#88765c", "#756047"][layer]);
      }
      return;
    }

    const m = S.map;
    ensureBuildingStyles(m);
    const terrain = m.terrain || [];
    const n = m.n;
    const clock = performance.now() / 1000;

    camera.x = (S.p.x - S.p.y) * 32;
    camera.y = (S.p.x + S.p.y) * 16;

    ctx.save();

    const cameraShake=Math.max(shake*.3,shotShake*4.21);
    if (cameraShake > 0) {
      ctx.translate(
        (Math.random() - .5) * cameraShake,
        (Math.random() - .5) * cameraShake
      );
    }

    // Масштабируем сцену целиком: персонажей, здания, пули и эффекты.
    // Существующий ctx.restore() снимает масштаб перед миникартой и прицелом.
    ctx.translate(W/2,H/2);
    ctx.scale(CFG.cameraZoom,CFG.cameraZoom);
    ctx.translate(-W/2,-H/2);

    // Единая песчаная поверхность без шахматной сетки.
    ctx.fillStyle = theme.sand;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    const corners=[
      cameraInputPoint(-180,-180),cameraInputPoint(W+180,-180),
      cameraInputPoint(-180,H+180),cameraInputPoint(W+180,H+180)
    ].map(p=>unproject(p.x,p.y));
    const xMin=Math.max(0,Math.floor(Math.min(...corners.map(p=>p.x)))-1);
    const xMax=Math.min(n-1,Math.ceil(Math.max(...corners.map(p=>p.x)))+1);
    const yMin=Math.max(0,Math.floor(Math.min(...corners.map(p=>p.y)))-1);
    const yMax=Math.min(n-1,Math.ceil(Math.max(...corners.map(p=>p.y)))+1);

    for (let y = yMin; y <= yMax; y++) {
      for (let x = xMin; x <= xMax; x++) {
        if (!visible(x + .5, y + .5, 80)) continue;

        const kind = terrain[y * n + x] || 0;
        const p = project(x + .5, y + .5);

        if (kind) {
          diamond(x + .5, y + .5,
            kind === 3 ? theme.wash : theme.road, 1.015);
        }

        // Детерминированная текстура: не мерцает между кадрами.
        const noise = ((x * 73856093) ^ (y * 19349663) ^ m.seed) >>> 0;

        if (kind === 0 && noise % 4 === 0) {
          strokeLine(
            p.x - 10, p.y + 1,
            p.x + 11, p.y - 1,
            "#eed7a33b", 1
          );
          strokeLine(
            p.x - 4, p.y + 4,
            p.x + 12, p.y + 2,
            "#6d573124", 1
          );
        }

        if ((kind === 1 || kind === 2) && noise % 5 === 0) {
          strokeLine(p.x - 10, p.y - 4, p.x, p.y + 1, "#433e354f", 1);
          strokeLine(p.x, p.y + 1, p.x + 3, p.y + 7, "#433e354f", 1);
        }

        if (kind === 1 && noise % 11 === 0) {
          // Потёртые отметки следуют дорожным клеткам любой схемы.
          strokeLine(p.x - 9, p.y - 4, p.x + 9, p.y + 4, "#d5bd816e", 2);
        }
      }
    }

    drawCombatGround();

    // Поселковые торговые точки.
    for (const sh of m.shops) {
      if (!visible(sh.x, sh.y)) continue;

      const p = project(sh.x, sh.y);

      diamond(sh.x, sh.y, "#b5ad79", 2.8);

      ink([
        { x: p.x - 30, y: p.y - 27 },
        { x: p.x + 17, y: p.y - 39 },
        { x: p.x + 34, y: p.y - 17 },
        { x: p.x - 18, y: p.y - 7 }
      ], sh.kind === "weapons" ? "#a7633d" : "#75816b");

      strokeLine(p.x - 26, p.y - 23, p.x - 26, p.y + 5, "#544530", 3);
      strokeLine(p.x + 28, p.y - 18, p.x + 28, p.y + 9, "#544530", 3);

      text(sh.kind === "weapons" ? "АРСЕНАЛ" : "МЕХАНИК",
        p.x, p.y - 48, 12, "#392f22");
    }

    // Выход — радиомаяк вместо неонового портала.
    const exit = project(m.exit.x, m.exit.y);
    const locked = S.enemies.some(e => e.boss);

    diamond(m.exit.x, m.exit.y, "#a79772", 1.8);
    strokeLine(exit.x - 12, exit.y, exit.x, exit.y - 66, "#484b3e", 4);
    strokeLine(exit.x + 12, exit.y, exit.x, exit.y - 66, "#484b3e", 4);
    strokeLine(exit.x - 8, exit.y - 25, exit.x + 8, exit.y - 25, "#484b3e", 3);
    strokeLine(exit.x, exit.y - 50, exit.x + 23, exit.y - 58, "#484b3e", 3);
    ellipse(exit.x, exit.y - 69, 5, 5, locked ? "#bd4634" : "#b6d58d");
    text(locked ? "СИГНАЛ ЗАГЛУШЕН" : "ЭВАКУАЦИЯ", exit.x, exit.y - 85, 11);

    drawMedkits();

    for (const l of S.loot) {
      if (!visible(l.x, l.y)) continue;
      const p = project(l.x, l.y, 9 + Math.sin(clock * 3) * 2);
      ellipse(p.x, p.y + 10, 13, 5, "#44392944");
      drawWeaponSprite(l.w,p.x-8,p.y,-.15,.65);
      text(["○", "◇", "✦", "★"][l.w.rare], p.x, p.y - 20, 13, RARITY[l.w.rare].color);
    }

    const objects = [];

    for (const b of m.buildings || []) {
      if (visible(b.x, b.y, 260)) {
        objects.push({
          type: "building",
          value: b,
          depth: b.x + b.y + (b.w + b.h) / 2
        });
      }
    }

    // Внешние скальные ограждения.
    for (let y = yMin; y <= yMax; y++) {
      for (let x = xMin; x <= xMax; x++) {
        const boundary = x === 0 || y === 0 || x === n - 1 || y === n - 1;

        if (boundary && m.tiles[y * n + x] && visible(x + .5, y + .5)) {
          objects.push({
            type: "rock",
            value: { x: x + .5, y: y + .5 },
            depth: x + y + 1
          });
        }

        // Поддержка старых сохранений: старые стены остаются видимыми.
        if (!m.desert && !boundary && m.tiles[y * n + x] && visible(x + .5, y + .5)) {
          objects.push({
            type: "rock",
            value: { x: x + .5, y: y + .5 },
            depth: x + y + 1
          });
        }
      }
    }

    for (const d of m.decor || []) {
      if (visible(d.x, d.y)) {
        objects.push({ type: "decor", value: d, depth: d.x + d.y });
      }
    }
    for(const d of m.landmarks||[]){
      if(visible(d.x,d.y,220)){
        objects.push({type:"decor",value:d,depth:d.x+d.y});
      }
    }

    for (const p of S.props) {
      if (visible(p.x, p.y)) {
        objects.push({ type: "prop", value: p, depth: p.x + p.y });
      }
    }

    for (const e of S.enemies) {
      if (visible(e.x, e.y)) {
        objects.push({ type: "actor", value: e, depth: e.x + e.y });
      }
    }

    for(const f of getCombatVisuals().particles){
      if(f.z>0&&visible(f.x,f.y,100)){
        objects.push({type:"combatFx",value:f,depth:f.x+f.y+.02});
      }
    }
    for(const drop of getCombatVisuals().bulletDrops){
      if(drop.z>0&&visible(drop.x,drop.y,100)){
        objects.push({type:"bulletDrop",value:drop,depth:drop.x+drop.y+.02});
      }
    }
    objects.push({ type: "player", value: S.p, depth: S.p.x + S.p.y });
    objects.sort((a, b) => a.depth - b.depth);

    for (const item of objects) {
      const o = item.value;

      if (item.type === "combatFx") {
        drawCombatParticle(o);
      } else if (item.type === "bulletDrop") {
        drawBulletDrop(o);
      } else if (item.type === "building") {
        drawBuilding(o, theme);
      } else if (item.type === "decor") {
        drawDecor(o);
      } else if (item.type === "rock") {
        const p = project(o.x, o.y);
        const h = 23 + ((Math.floor(o.x) * 7 + Math.floor(o.y) * 11) % 19);

        ink([
          { x: p.x - 31, y: p.y },
          { x: p.x - 17, y: p.y - h },
          { x: p.x + 7, y: p.y - h - 7 },
          { x: p.x + 31, y: p.y - 5 },
          { x: p.x + 10, y: p.y + 14 }
        ], "#8d7858", 2);

        strokeLine(p.x - 13, p.y - h + 4, p.x + 4, p.y - h,
          "#c3ab7e", 2);
      } else if (item.type === "prop") {
        const p = project(o.x, o.y);

        if (o.kind === "barrel") {
          ctx.fillStyle = "#9c5035";
          ctx.fillRect(p.x - 10, p.y - 24, 20, 23);
          ctx.strokeStyle = "#352d25";
          ctx.lineWidth = 2;
          ctx.strokeRect(p.x - 10, p.y - 24, 20, 23);
          ellipse(p.x, p.y - 24, 10, 4, "#b6794e");
          ctx.stroke();
          strokeLine(p.x - 10, p.y - 15, p.x + 10, p.y - 15, "#473e31", 3);
          text("!", p.x, p.y - 5, 13, "#ebd7a4");
        } else {
          block(o.x, o.y, 19, "#9b8157", "#64563f", .6);
          strokeLine(p.x - 15, p.y - 17, p.x + 12, p.y - 2, "#453927", 2);
          strokeLine(p.x - 13, p.y - 3, p.x + 12, p.y - 17, "#453927", 2);
        }
      } else {
        drawActor(o, item.type === "player");
      }
    }

    drawBarrelExplosions();

    // Предупреждения рисуются поверх окружения для читаемости.
    for (const e of S.enemies) {
      if (e.hp <= 0 || !visible(e.x, e.y)) continue;
      const behavior = enemyBehaviorStates.get(e);
      const alerted = behavior?.map === S.map && behavior.alert > 0;
      if (!alerted && !(e.wind > 0)) continue;

      const p = project(e.x, e.y, 19);
      const markerY = p.y - (e.boss ? 83 : 47);
      ctx.save();
      ctx.font = "bold 25px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.lineJoin = "round";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#fff0cf";
      ctx.strokeText("!", p.x, markerY);
      text("!", p.x, markerY, 25, "#d52319");
      ctx.restore();

      if (e.boss && e.wind > 0) {
        ctx.strokeStyle = "#a82d22";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y + 19, 100, 50, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    for (const b of S.bullets) {
      if (!visible(b.x, b.y, 20)) continue;

      const p = project(b.x, b.y, 19);
      const prev = project(b.x - b.vx * .012, b.y - b.vy * .012, 19);

      strokeLine(prev.x, prev.y, p.x, p.y,
        b.enemy ? "#bd3c28" : "#fff0bb", b.enemy ? 4 : 3);

      if (b.enemy) {
        ellipse(p.x, p.y, 3, 3, "#ea8450");
      }
    }

    ctx.globalAlpha = settings.flash;
    for (const f of S.fx) {
      const p = project(f.x, f.y, 15);
      ctx.fillStyle = f.color === "#fff" ? "#f5d79b" : "#c4894e";
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    drawReloadProgress();
    drawHealingStatus();

    // Редкие ветровые полосы: не закрывают персонажей и пули.
    ctx.globalAlpha = .08 * settings.flash;
    for (let i = 0; i < 12; i++) {
      const x = ((i * 173 + clock * 21) % (W + 180)) - 90;
      const y = (i * 97 + Math.sin(clock * .2 + i) * 20) % H;
      strokeLine(x, y, x + 75, y - 5, "#fff0cb", 2);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // Мягкое затемнение краёв — без цветового фильтра поверх объектов.
    const vignette = ctx.createRadialGradient(
      W / 2, H / 2, H * .25,
      W / 2, H / 2, Math.max(W, H) * .72
    );
    vignette.addColorStop(0, "#38271400");
    vignette.addColorStop(1, "#38271440");
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    drawMinimap();
    drawHUD();

    if (!paused) {
      ctx.strokeStyle = "#342c22";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 6, 0, Math.PI * 2);
      ctx.moveTo(mouse.x - 12, mouse.y);
      ctx.lineTo(mouse.x - 8, mouse.y);
      ctx.moveTo(mouse.x + 8, mouse.y);
      ctx.lineTo(mouse.x + 12, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - 12);
      ctx.lineTo(mouse.x, mouse.y - 8);
      ctx.moveTo(mouse.x, mouse.y + 8);
      ctx.lineTo(mouse.x, mouse.y + 12);
      ctx.stroke();
    }
  };

  // ---------------- Интерфейс и новая терминология ----------------

  const originalHUD = drawHUD;

  drawHUD = function() {
    originalHUD();

    const hint = $("#hint");
    hint.textContent = hint.textContent
      .replace("Портал закрыт: победите Дискоядро", "Маяк заглушён: победите Железного смотрителя");
  };

  const originalMenu = menu;

  menu = function() {
    originalMenu();

    const heading = $("#content h1");
    if (heading) {
      heading.textContent = "BORDOUT: New Cubics";
      heading.style.fontFamily = 'Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif';
      heading.style.fontWeight = "400";
      heading.style.textTransform = "none";
    }

    const paragraphs = $("#content").querySelectorAll("p");
    if (paragraphs[0]) {
      paragraphs[0].textContent =
        "Смертельная пустошь · Ржавые поселения · Процедурный рогалик";
    }

    const intro = $("#content .card p");
    if (intro) {
      intro.textContent =
        "Найдите эвакуационный маяк. Ищите оружие среди руин, обходите патрули и берегите патроны.";
    }
  };

  const originalToast = toast;

  toast = function(message) {
    originalToast(
      message
        .replace("«Дискоядро»", "«Железный смотритель»")
        .replace("Найдите портал.", "Найдите эвакуационный маяк.")
    );
  };

  menu();
})();
</script>
</body>
</html>
