<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRISM RUN — Y2K roguelite</title>
<link rel="icon" type="image/x-icon" href="dustardico.ico">
<style>
:root {
  --rust: #ad543c;
  --steel: #6e8d8b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #b79a70;
  color: #332a22;
  font: 14px "Trebuchet MS", Arial, sans-serif;
}

#game {
  display: block;
  position: fixed;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
}

button,
input {
  font: inherit;
}

button {
  padding: 10px 15px;
  border: 2px solid #493a29;
  border-radius: 3px;
  background: linear-gradient(#e4c48a, #b99864);
  color: #30291e;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  cursor: pointer;
  box-shadow: 0 3px 0 #58452d;
}

button:hover:not(:disabled) {
  background: #eab45f;
}

button:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #58452d;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

button:focus-visible,
input:focus-visible,
summary:focus-visible {
  outline: 3px solid #52797a;
  outline-offset: 3px;
}

input {
  accent-color: #a56334;
}

#seed {
  max-width: 100%;
  padding: 8px;
  border: 1px solid #897251 !important;
  border-radius: 3px !important;
  background: #f0dfbd;
  color: #332a22;
}

input::placeholder {
  color: #807059;
}

input[type="range"] {
  max-width: 100%;
  vertical-align: middle;
}

label {
  display: block;
  margin: 15px 0;
}

h1,
h2,
h3,
p {
  margin: 0 0 12px;
}

h1,
h2,
h3 {
  text-transform: uppercase;
}

h1 {
  font-size: 29px;
  letter-spacing: 2px;
}

h3 {
  overflow-wrap: anywhere;
}

#content .death-title {
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  font-size: clamp(48px, 10vw, 80px);
  font-weight: 400;
  line-height: 1;
  letter-spacing: 2px;
  color: #a52d21;
}

.panel {
  padding: 12px 16px;
  border: 2px solid #4d4030;
  border-radius: 5px;
  background: linear-gradient(135deg, #ead9b8f5, #c9b18eef);
  color: #332a22;
  box-shadow: 5px 6px 0 #30291e55;
  backdrop-filter: none;
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  max-width: min(590px, 72vw);
  pointer-events: none;
}

.bar {
  height: 12px;
  margin: 5px 0;
  overflow: hidden;
  border-radius: 2px;
  background: #736049;
}

.bar i {
  display: block;
  height: 100%;
  transition: width .15s;
}

#playerHUD .hp-bar i {
  background: var(--rust);
}

#lowerHUD {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  display: grid;
  grid-template-columns: minmax(0, 360px) minmax(0, 1fr);
  align-items: end;
  gap: 12px;
  pointer-events: none;
}

#playerHUD {
  grid-column: 1;
  grid-row: 1;
  width: 100%;
  max-width: 360px;
  min-width: 0;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

#playerHUD .hero-values {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
}

#playerHUD .hero-upgrades {
  margin-top: 6px;
}

#playerHUD .hero-header,
#playerHUD .hero-money,
#playerHUD .hero-slots,
#playerHUD .hero-weapon-title {
  display: flex;
  align-items: center;
  gap: 8px;
}

#playerHUD .hero-header {
  justify-content: space-between;
  flex-wrap: wrap;
  padding-bottom: 8px;
  border-bottom: 1px solid #897251;
}

#playerHUD .hero-money {
  min-width: 0;
  font-size: 20px;
  font-weight: 900;
}

#playerHUD .hero-money svg {
  flex: 0 0 24px;
  width: 24px;
  height: 24px;
}

.currency-cap {
  display: inline-block;
  width: 1.25em;
  height: 1.25em;
  vertical-align: -.25em;
  pointer-events: none;
}

#modal .currency-cap > svg {
  display: block;
  width: 100%;
  height: 100%;
  margin: 0;
}

#playerHUD .hero-slots {
  flex-shrink: 0;
  gap: 5px;
}

#playerHUD .hero-slot {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 1px solid #897251;
  border-radius: 3px;
  background: #bba17a;
  color: #574936;
  font-size: 16px;
  font-weight: 900;
}

#playerHUD .hero-slot[aria-current="true"] {
  border: 2px solid #465636;
  background: #b9c68e;
  color: #26351e;
  box-shadow: inset 0 -3px 0 #64744b;
}

#playerHUD .hero-weapon-title {
  margin-top: 7px;
  font-weight: 800;
}

#playerHUD .hero-weapon-icon {
  flex: 0 0 42px;
}

#playerHUD .hero-weapon-icon svg {
  display: block;
  width: 42px;
  height: 28px;
}

#playerHUD .hero-weapon-title strong {
  min-width: 0;
}

#playerHUD .hero-weapon-art {
  margin: 5px 0;
  border: 1px solid #897251;
  border-radius: 3px;
  background-color: #e9d9b6;
  background-image:
    linear-gradient(#89725120 1px, transparent 1px),
    linear-gradient(90deg, #89725120 1px, transparent 1px);
  background-size: 16px 16px;
}

#playerHUD .hero-weapon-art svg {
  display: block;
  width: 100%;
  height: clamp(56px, 12vh, 100px);
}

#playerHUD .hero-ammo {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 12px;
}

#playerHUD .hero-ammo-loaded {
  font-size: 30px;
  font-weight: 900;
  line-height: 1.1;
}

#playerHUD .hero-ammo-loaded small {
  font-size: 16px;
  color: #736047;
}

#playerHUD .hero-ammo-empty {
  color: #a52d21;
}

#playerHUD .hero-weapon-status {
  margin: 4px 0 8px;
  padding-bottom: 7px;
  border-bottom: 1px solid #897251;
}

#playerHUD .hero-meters {
  display: grid;
  grid-template-columns: min(110px, 44%) minmax(0, 1fr);
  align-items: center;
  gap: 6px 8px;
  margin: 5px 0 8px;
}

#playerHUD .hero-meter-label {
  min-width: 0;
  font-size: 11px;
  font-weight: 800;
  line-height: 1.2;
}

#playerHUD .hero-meters .bar,
#playerHUD .hero-meters .armor-cells {
  width: 100%;
  min-width: 0;
  margin: 0;
}

#playerHUD .hero-meters .armor-cells {
  gap: clamp(1px, .25vw, 4px);
}

#hud {
  overflow-wrap: anywhere;
}

.armor-cells {
  display: flex;
  gap: 4px;
  height: 12px;
  margin: 5px 0;
}

.armor-cells i {
  flex: 1;
  min-width: 0;
  border: 1px solid #4c5b56;
  border-radius: 2px;
  background: var(--steel);
}

.armor-cells i.empty {
  border-color: #897251;
  background: #73604955;
}

#bottom {
  grid-column: 2;
  grid-row: 1;
  justify-self: center;
  width: 100%;
  max-width: 520px;
  min-width: 0;
  text-align: center;
  overflow-wrap: anywhere;
  pointer-events: none;
}

#toast {
  margin-bottom: 8px;
  color: #fff0ca;
  font-weight: 800;
  text-shadow: 1px 2px 2px #22180e;
}

#hint {
  font-weight: bold;
}

#topButtons {
  position: fixed;
  right: 14px;
  bottom: 270px;
}

#ammoHUD {
  grid-column: 3;
  grid-row: 1;
  justify-self: end;
  width: 260px;
  min-width: 0;
  max-width: 100%;
  pointer-events: none;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

#ammoHUD .ammo-weapon {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
  text-align: left;
}

#ammoHUD .ammo-weapon svg {
  flex: 0 0 108px;
  width: 108px;
  height: 52px;
}

#ammoHUD .ammo-weapon span {
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 12px;
  font-weight: bold;
}

#ammoHUD .ammo-label {
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
}

#ammoHUD .ammo-loaded {
  font-size: 52px;
  line-height: 1.1;
  font-weight: 900;
}

#ammoHUD .ammo-capacity {
  font-size: 26px;
  color: #736047;
}

#ammoHUD .ammo-reserve {
  font-size: 30px;
  line-height: 1.2;
  font-weight: 900;
}

#ammoHUD .ammo-status {
  min-height: 20px;
  margin-top: 4px;
  font-size: 13px;
  font-weight: bold;
}

#ammoHUD .ammo-empty {
  color: #a52d21;
}

#modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #241c13a8;
}

#modal.hidden {
  display: none;
}

#modal.main-menu,
#modal.menu-background {
  background: #241c13 url("background.jpg") center center / cover no-repeat;
}

#modal.main-menu > #content {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) min(360px, 55%);
  align-items: end;
  gap: clamp(12px, 3vw, 64px);
  width: 100%;
  height: 100%;
  max-height: none;
  margin: 0;
  padding: clamp(12px, 3vmin, 48px);
  padding-left: max(clamp(12px, 3vmin, 48px), env(safe-area-inset-left));
  padding-right: max(clamp(12px, 3vmin, 48px), env(safe-area-inset-right));
  padding-bottom: max(clamp(12px, 3vmin, 48px), env(safe-area-inset-bottom));
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  overflow: hidden;
}

#modal.main-menu .main-menu-logo {
  display: block;
  align-self: end;
  justify-self: start;
  width: 100%;
  max-width: 720px;
  height: min(36vh, 320px);
  height: min(36dvh, 320px);
  min-width: 0;
  object-fit: contain;
  object-position: left bottom;
  color: #fff0cf;
}

#modal.main-menu .main-menu-controls {
  display: grid;
  gap: 10px;
  align-self: end;
  min-width: 0;
  min-height: 0;
  max-height: 100%;
  padding: 8px 8px 12px;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}

#modal.main-menu .main-menu-controls > button,
#modal.main-menu .main-menu-controls > input {
  width: 100%;
  min-width: 0;
}

#modal.main-menu .main-menu-controls > button {
  white-space: normal;
  overflow-wrap: anywhere;
}

@media (max-width: 480px) {
  #modal.main-menu > #content {
    grid-template-columns: minmax(0, 1fr) minmax(0, 62%);
    gap: 8px;
  }

  #modal.main-menu .main-menu-controls {
    gap: 8px;
    padding: 6px 6px 10px;
  }

  #modal.main-menu .main-menu-controls > button {
    padding: 9px 6px;
    font-size: 12px;
    letter-spacing: 0;
  }
}

#portalLabels {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  overflow: hidden;
}

#portalLabels[hidden] {
  display: none;
}

#portalLabels > span {
  position: absolute;
  transform: translate(-50%, -100%);
  padding: 3px 6px;
  border-radius: 3px;
  background: #241c13d9;
  color: #fff0cf;
  font: bold 13px/1.2 system-ui, sans-serif;
  white-space: nowrap;
  text-shadow: 0 1px 2px #000;
}

.window {
  width: min(930px, 96vw);
  max-height: 90vh;
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: #897251 #d4bd95;
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: 12px;
}

.card {
  flex: 1;
  min-width: 225px;
  margin-bottom: 10px;
  padding: 14px;
  border: 1px solid #736047;
  border-radius: 3px;
  background: #efe0bf99;
}

.small {
  font-size: 12px;
  line-height: 1.6;
  opacity: .85;
}

.tag {
  display: inline-block;
  margin: 0 4px 6px 0;
  padding: 3px 8px;
  border-radius: 2px;
  background: #bba17a;
  color: #332a22;
  font-size: 12px;
  font-weight: bold;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

details {
  margin: 12px 0;
  padding: 10px;
  border: 1px solid #897251;
  border-radius: 3px;
  background: #e3cfaa80;
}

summary {
  color: #493a29;
  font-weight: bold;
  cursor: pointer;
}

details[open] summary {
  margin-bottom: 12px;
}

.inventory-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.inventory-heading h1 {
  margin: 0;
}

.inventory-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px;
}

.inventory-layout > section {
  min-width: 0;
}

.inventory-character {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 100px minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  min-height: 310px;
  padding: 8px;
  border: 1px solid #897251;
  background: #bba17a50;
}

.inventory-avatar {
  width: 100%;
  height: 290px;
}

.inventory-hand {
  min-width: 0;
}

.inventory-item {
  width: 100%;
  min-width: 0;
  padding: 8px;
  text-align: left;
  text-transform: none;
  letter-spacing: 0;
  overflow-wrap: anywhere;
}

.inventory-item svg {
  display: block;
  width: 100%;
  height: 60px;
  pointer-events: none;
}

.inventory-item[aria-pressed="true"] {
  border-color: #465636;
  background: #b9c68e;
  box-shadow: 0 3px 0 #465636;
}

.inventory-item[aria-pressed="true"] svg {
  width: calc(100% + 12px);
  height: 90px;
  margin-left: -6px;
  margin-right: -6px;
}

.inventory-tooltip svg {
  display: block;
  width: 100%;
  height: 180px;
}

.inventory-hand > button + button {
  width: 100%;
  margin-top: 8px;
  padding: 6px;
  font-size: 11px;
}

.inventory-floor {
  min-height: 120px;
  padding: 12px;
  border: 2px dashed #897251;
}

.inventory-floor h2 {
  font-size: 30px;
  letter-spacing: 2px;
}

.inventory-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  max-height: 42vh;
  overflow: auto;
  padding: 4px;
  overscroll-behavior: contain;
}

.inventory-shop {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 2px solid #897251;
}

.inventory-entry {
  min-width: 0;
}

.inventory-entry-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.inventory-entry-actions button {
  flex: 1 1 100%;
  min-width: 0;
  padding: 6px;
  font-size: 11px;
  overflow-wrap: anywhere;
}

@media (min-width: 900px) {
  #content.inventory-comparison-window {
    flex-shrink: 0;
    width: min(930px, calc(100vw - 352px));
    margin-right: 312px;
  }
}

@media (min-width: 900px) and (max-width: 1100px) {
  .inventory-comparison-window .inventory-layout {
    grid-template-columns: minmax(0, 1fr);
  }
}

.inventory-tooltip {
  position: fixed;
  z-index: 120;
  pointer-events: none;
  overflow-wrap: anywhere;
  width: min(300px, calc(100vw - 16px));
  max-height: calc(100vh - 16px);
  overflow: auto;
  overscroll-behavior: contain;
  background: #ead9b8;
  box-shadow: 0 5px 20px #241c1370;
}

.inventory-tooltip .inventory-tooltip-actions {
  position: sticky;
  top: -12px;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: -12px -16px 10px;
  padding: 10px 12px;
  background: #dac399;
  border-bottom: 1px solid #897251;
}

.inventory-tooltip button {
  padding: 6px 8px;
  font-size: 11px;
}

.inventory-tooltip .weapon-stat {
  flex-wrap: wrap;
}

.inventory-tooltip .weapon-stat__value {
  margin-left: auto;
}

.inventory-tooltip:focus-visible {
  outline: 3px solid #52797a;
}

@media (max-width: 760px) {
  .inventory-layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .inventory-character {
    min-height: 260px;
    grid-template-columns: minmax(0, 1fr) 80px minmax(0, 1fr);
  }

  .inventory-avatar {
    height: 250px;
  }

  .inventory-heading h1 {
    font-size: 22px;
  }

  .inventory-tooltip .inventory-tooltip-actions {
    top: -10px;
    margin: -10px -12px 10px;
  }
}

.window.weapon-shop-window {
  height: 90vh;
  overflow: hidden;
}

.weapon-shop {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  gap: 8px;
}

.shop-heading,
.shop-equipped,
.shop-navigation {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.shop-heading {
  justify-content: space-between;
}

.shop-heading h2 {
  margin: 0;
  font-size: 19px;
}

.shop-heading button {
  padding: 6px 10px;
}

.weapon-shop .weapon-slot-picker {
  margin: 0;
}

.weapon-shop .weapon-slot-picker > p {
  display: none;
}

.weapon-shop .weapon-slot-picker .actions {
  flex-wrap: nowrap;
  margin: 0;
  gap: 6px;
}

.weapon-shop .weapon-slot-picker button {
  padding: 6px 8px;
  font-size: 11px;
  text-transform: none;
}

.shop-equipped {
  padding: 8px 10px;
  border: 2px solid #64744b;
  border-radius: 4px;
  background: #dae0b9;
}

.shop-equipped > svg {
  flex: 0 0 116px;
  width: 116px;
  height: 64px;
}

.shop-equipped > div {
  min-width: 0;
}

.shop-equipped h3 {
  margin: 2px 0;
  font-size: 14px;
}

.shop-equipped .small {
  line-height: 1.35;
}

.shop-navigation {
  position: sticky;
  top: 0;
  z-index: 2;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  margin-bottom: 10px;
  padding: 8px;
  border-bottom: 1px solid #897251;
  background: #e5d1aa;
}

.shop-arrow-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.shop-arrow-row > span {
  min-width: 0;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
}

.shop-arrow-row > button {
  flex: 0 0 auto;
}

.shop-navigation button {
  padding: 7px 10px;
}

.shop-navigation > span {
  font-size: 12px;
  font-weight: bold;
}

.shop-navigation .shop-purchase {
  width: 100%;
  margin-left: 0;
  white-space: normal;
  overflow-wrap: anywhere;
  background: #bccb91;
}

.shop-comparison {
  flex: 1 1 0;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #897251 #d4bd95;
  border-top: 1px solid #897251;
  padding-top: 8px;
}

.shop-comparison:focus-visible {
  outline: 3px solid #52797a;
  outline-offset: -3px;
}

.shop-comparison-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  align-items: start;
}

.shop-comparison .card {
  min-width: 0;
  margin: 0;
  padding: 10px;
}

.shop-comparison .shop-current {
  border: 2px solid #64744b;
}

.shop-comparison .shop-offer > svg {
  height: 58px;
}

.shop-comparison .weapon-stat {
  flex-wrap: wrap;
  gap: 2px 8px;
}

.shop-comparison .weapon-stat__value {
  margin-left: auto;
}

@media (max-width: 600px) {
  .window.weapon-shop-window {
    height: 94vh;
  }

  .shop-heading h2 {
    font-size: 15px;
  }

  .shop-equipped > svg {
    flex-basis: 76px;
    width: 76px;
    height: 46px;
  }

  .shop-equipped h3 {
    font-size: 12px;
  }

  .shop-comparison-grid {
    gap: 5px;
  }

  .shop-comparison .card {
    padding: 6px;
  }

  .shop-comparison h3 {
    font-size: 12px;
  }

  runTime=Math.min(dt,p.stamina/stats.drain);

async function buildSoundBank(){

  const variants=name==="ambience"?1:3;
  for(let variant=0;variant<variants;variant++){
   const wav=synthesizeSound(name,variant);
   const buffer=await audio.decodeAudioData(wav.slice(0));
   if(!buffer.length||!Number.isFinite(buffer.duration)){
    throw Error("Не удалось декодировать "+name);
   }
   soundBank.set(name+"_"+variant,{wav,buffer});
  }
  // Отдаём управление странице между группами сэмплов.
  await new Promise(resolve=>setTimeout(resolve,0));

}
function unlockSound(){
 try{
  if(!audio){
   const AudioContextClass=window.AudioContext||window.webkitAudioContext;
   if(!AudioContextClass)return Promise.resolve(false);
   audio=new AudioContextClass();
   soundMaster=audio.createGain();
   soundEffects=audio.createGain();
   soundSteps=audio.createGain();
   soundAmbient=audio.createGain();
   soundMaster.gain.value=0;
   soundAmbient.gain.value=0;
   soundEffects.connect(soundMaster);
   soundSteps.connect(soundMaster);
   soundAmbient.connect(soundMaster);
   const compressor=audio.createDynamicsCompressor();
   compressor.threshold.value=-10;
   compressor.knee.value=12;
   compressor.ratio.value=8;
   compressor.attack.value=.003;
   compressor.release.value=.15;
   soundMaster.connect(compressor);
   compressor.connect(audio.destination);
  }
  // resume вызывается непосредственно из пользовательского события.
  if(audio.state==="suspended")audio.resume().catch(()=>{});
  if(!soundLoading){
   soundLoading=buildSoundBank().then(()=>{
    soundError="";
    syncSound();
    updateSoundStatus();
    return true;
   }).catch(error=>{
    soundError="Не удалось подготовить звук. Обновите страницу для повторной попытки.";
    console.warn("WAV audio:",error);
    updateSoundStatus();
    return false;
   });
   updateSoundStatus();
  }
  syncSound();
  return soundLoading;
 }catch(error){
  soundError="Аудио недоступно в этом браузере.";
  updateSoundStatus();
  return Promise.resolve(false);
 }
}

}
function stopGameSounds(){

function positionSoundVoice(voice,immediate=false){
 if(!voice.actor||!S)return;
 const dx=voice.actor.x-S.p.x,dy=voice.actor.y-S.p.y;
 const distance=Math.hypot(dx,dy);
 const volume=voice.uniformVolume?voice.level:
  voice.level*Math.pow(clamp(1-distance/13,0,1),2);
 const pan=clamp((dx-dy)/(13*Math.SQRT2),-.95,.95);
 if(immediate){
  voice.gain.gain.value=volume;
  if(voice.pan)voice.pan.pan.value=pan;
 }else{
  voice.gain.gain.setTargetAtTime(volume,audio.currentTime,.025);
  if(voice.pan)voice.pan.pan.setTargetAtTime(pan,audio.currentTime,.025);
 }
}
function playWav(name,{volume=1,rate=1,actor=null,step=false}={}){
 if(!soundReady||!audio||audio.state!=="running"||
    !S||S.dead||paused||document.hidden||!document.hasFocus()||
    soundLevel("volume",.15)===0)return;
 const uniformVolume=name==="barrel_explosion"||SHOT_SOUNDS.includes(name);
 if(actor&&!uniformVolume&&dist(actor,S.p)>=13)return;
 if(soundVoices.size>=40||(actor&&soundVoices.size>=24))return;
 const variants=soundVariants.get(name);
 if(!variants?.length)return;
 const entry=variants[Math.floor(soundRandom()*variants.length)];
 const source=audio.createBufferSource(),gain=audio.createGain();
 const nodes=[source,gain];
 source.buffer=entry.buffer;
 source.playbackRate.value=clamp(rate,.65,1.4);
 gain.gain.value=volume;
 source.connect(gain);
 let output=gain,pan=null;
 if(step&&!actor){
  // Сохраняем шорох земли и короткую атаку дорожного шага.
  const road=name==="player_step_road"||name==="step_road";
  const filter=audio.createBiquadFilter();
  filter.type="lowpass";
  filter.frequency.value=road?3200:6500;
  filter.Q.value=.5;
  output.connect(filter);output=filter;nodes.push(filter);
  const now=audio.currentTime;
  const duration=entry.buffer.duration/source.playbackRate.value;
  const attack=Math.min(road?.003:.006,duration*.2);
  const release=Math.min(.035,duration*.25);
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(volume,now+attack);
  gain.gain.setValueAtTime(volume,now+duration-release);
  gain.gain.linearRampToValueAtTime(0,now+duration);
 }
 if(actor){
  const filter=audio.createBiquadFilter();
  filter.type="lowpass";
  const clear=uniformVolume||lineClear(S.p,actor);
  filter.frequency.value=clear?6500:1100;
  output.connect(filter);output=filter;nodes.push(filter);
  if(!clear)volume*=.4;
  if(typeof audio.createStereoPanner==="function"){
   pan=audio.createStereoPanner();
   output.connect(pan);output=pan;nodes.push(pan);
  }
 }
 output.connect(step?soundSteps:soundEffects);
 const voice={source,gain,pan,nodes,actor,level:volume,uniformVolume,ui:false};
 positionSoundVoice(voice,true);

 source.onended=()=>releaseSoundVoice(voice);

function soundFootstep(actor,moved){

 if(footstepMap!==S.map){
  footstepMap=S.map;
  footstepStates=new WeakMap();
 }
 let state=footstepStates.get(actor);
 if(!state){
  state={distance:actor===S.p?0:soundRandom()*.6,side:0};
  footstepStates.set(actor,state);
 }
 state.distance+=moved;
 // Два шага на цикл существующей анимации ног.
 const stride=Math.PI/4.8;
 if(state.distance<stride)return;
 state.distance%=stride;
 state.side=1-state.side;
 const player=actor===S.p;
 if(!player&&dist(actor,S.p)>=13)return;
 const terrain=S.map.terrain?.[Math.floor(actor.y)*S.map.n+Math.floor(actor.x)]||0;
 const stepName=terrain===1||terrain===2?"step_road":"step_sand";
 playWav(player?"player_"+stepName:stepName,{
  volume:player?(S.p.sprinting?.64:.44)*(stepName==="step_road"?1.2:1):.95,
  rate:(player?1:actor.type===1?.8:1.02)+(state.side?.035:-.035),
  actor:player?null:actor,
  step:true
 });
}
function syncSound(){

 soundTarget(soundMaster,audible?soundLevel("volume",.15):0);
 soundTarget(soundEffects,soundLevel("effects",.85));
 soundTarget(soundSteps,soundLevel("steps",.8));
 soundTarget(soundAmbient,
  audible?.3*(paused?.4:1):0,.35);
 if(paused||!S||S.dead||!audible)stopGameSounds();
 else for(const voice of soundVoices){
  if(voice.actor){
   if(voice.actor.hp<=0){
    try{voice.source.stop()}catch{}
    releaseSoundVoice(voice);
   }else positionSoundVoice(voice);
  }

  const entry=soundBank.get("ambience_0");
  if(entry){

  if(audio.state!=="running"||performance.now()-requested>300||
     document.hidden||!document.hasFocus()||
     soundLevel("volume",.15)===0||soundVoices.size>=40)return;
  syncSound();
  const now=audio.currentTime;
  oscillator=audio.createOscillator();
  gain=audio.createGain();
  filter=audio.createBiquadFilter();
  oscillator.type="triangle";
  oscillator.frequency.setValueAtTime(1250,now);
  oscillator.frequency.exponentialRampToValueAtTime(420,now+.045);
  filter.type="lowpass";
  filter.frequency.value=2200;
  filter.Q.value=.5;
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(.24,now+.002);
  gain.gain.exponentialRampToValueAtTime(.001,now+.045);
  gain.gain.linearRampToValueAtTime(0,now+.06);
  oscillator.connect(filter);
  filter.connect(gain);
  // Общая громкость действует и в меню, и до начала забега.
  gain.connect(soundMaster);
  voice={source:oscillator,nodes:[oscillator,filter,gain],ui:true};
  soundVoices.add(voice);
  oscillator.onended=()=>releaseSoundVoice(voice);
  oscillator.start(now);
  oscillator.stop(now+.065);
 }catch(error){
  if(oscillator){
   try{oscillator.stop()}catch{}
  }
  if(voice)releaseSoundVoice(voice);
  else for(const node of [oscillator,filter,gain])node?.disconnect();
  console.warn("Не удалось воспроизвести щелчок кнопки:",error);
 }
}

function makeCapDrops(origin,amount,seed){
 if(!Number.isSafeInteger(amount)||amount<=0||
    !Number.isFinite(origin.x)||!Number.isFinite(origin.y))return [];
 const random=rng(seed);
 const count=Math.min(amount,origin.boss?8:3);
 const base=Math.floor(amount/count),remainder=amount%count;
 return Array.from({length:count},(_,i)=>{
  const angle=(i+random()*.4)/count*Math.PI*2;
  const speed=1.5+random()*1.5;
  return {
   x:origin.x,y:origin.y,capValue:base+(i<remainder?1:0),
   age:0,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed
  };
 });
}
function normalizeCapDrops(state){
 const m=state.map;
 state.caps=(Array.isArray(state.caps)?state.caps:[]).filter(c=>{
  if(!c||!Number.isFinite(c.x)||!Number.isFinite(c.y)||
     !Number.isSafeInteger(c.capValue)||c.capValue<=0)return false;
  const x=Math.floor(c.x),y=Math.floor(c.y);
  return x>=0&&y>=0&&x<m.n&&y<m.n&&m.tiles[y*m.n+x]===0;
 }).map(c=>({
  x:c.x,y:c.y,capValue:c.capValue,
  age:Number.isFinite(c.age)?clamp(c.age,0,CFG.capScatterSeconds):CFG.capScatterSeconds,
  vx:Number.isFinite(c.vx)?clamp(c.vx,-3,3):0,
  vy:Number.isFinite(c.vy)?clamp(c.vy,-3,3):0
 }));
}
function capPathClear(a,b){
 // Проверяем весь отрезок, включая конец: крышки не проходят сквозь стены.
 const steps=Math.max(1,Math.ceil(dist(a,b)/.05));
 for(let i=0;i<=steps;i++){
  const t=i/steps;
  if(!valid(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,.04))return false;
 }
 return true;
}
function stepCapDrop(c,player,dt,clear){
 if(!Number.isFinite(dt)||dt<=0)return false;
 const scatter=Math.min(dt,Math.max(0,CFG.capScatterSeconds-c.age));
 if(scatter>0){
  const nextAge=Math.min(CFG.capScatterSeconds,c.age+scatter);
  const travel=(Math.exp(-6*c.age)-Math.exp(-6*nextAge))/6;
  const target={x:c.x+c.vx*travel,y:c.y+c.vy*travel};
  if(clear(c,target)){c.x=target.x;c.y=target.y}
  else {c.vx=0;c.vy=0}
  c.age=nextAge;
 }
 const remaining=dt-scatter;
 if(remaining<=0)return false;
 const distance=dist(c,player);
 if(distance>CFG.capMagnetRadius||!clear(c,player))return false;
 if(distance<=CFG.capPickupRadius)return true;
 const speed=4+(CFG.capMagnetRadius-distance)*4;
 const travel=Math.min(distance,speed*remaining);
 c.x+=(player.x-c.x)*travel/distance;
 c.y+=(player.y-c.y)*travel/distance;
 return dist(c,player)<=CFG.capPickupRadius;
}
function updateCapDrops(dt){
 if(!S||paused||S.dead||S.between||!Number.isFinite(dt)||dt<=0)return;
 capPickupSoundWait=Math.max(0,capPickupSoundWait-dt);
 const caps=S.caps;
 if(!caps?.length)return;
 let write=0,amount=0;
 for(const c of caps){
  if(stepCapDrop(c,S.p,dt,capPathClear))amount+=c.capValue;
  else caps[write++]=c;
 }
 // Удаление и начисление происходят вместе, до следующего сохранения.
 caps.length=write;
 if(amount>0){
  S.money+=amount;
  if(capPickupSoundWait===0){
   playWav("coin_pickup",{volume:.65});
   capPickupSoundWait=.07;
  }
 }
}

      !room?.map?.interior)throw Error("Старый интерьер");
   if(state.houseRooms[Number(key)]==null)state.houseRooms[Number(key)]=room;
  }

   state.outdoorScene=legacy.outside;
   state.houseIndex=legacy.active;
   state.houseReturn=legacy.returnPoint;

     !mapPositionClear(outside.map,state.houseReturn)){

      const otherShown = Number(other.toFixed(digits));

        (currentShown - otherShown).toFixed(digits)
      );

      if (difference === 0) {

        const symbol = better ? "+" : "−";
        const css = better ? "better" : "worse";
        const verdict = better ? "Лучше" : "Хуже";

        const amount = format(Math.abs(difference), digits);

    ${row(
      "Дальность",

    )}

    ${row(

function weaponDifferences(w,reference){
 const fragment=document.createDocumentFragment();
 const message=value=>{
  const el=document.createElement("div");
  el.className="small";
  el.textContent=value;
  fragment.appendChild(el);
 };
 if(!w||!reference){
  message(!w&&!reference?"Отличий нет.":
   "Сравнение огнестрельного и холодного оружия недоступно.");
  return fragment;
 }
 const degrees=value=>value*180/Math.PI;
 const fields=[
  ["Урон одного снаряда",w.damage,reference.damage,0,"HP"],
  ["Снарядов за выстрел",w.pellets,reference.pellets,0,""],
  ["Темп стрельбы",w.rate,reference.rate,1,"/с"],
  ["Размер магазина",w.mag,reference.mag,0,""],
  ["Перезарядка",w.reload,reference.reload,2,"с",true],
  ["Разброс",degrees(w.spread),degrees(reference.spread),1,"°",true],
  ["Дальность",w.range,reference.range,1,"м"],
  ["Скорость снаряда",w.speed,reference.speed,1,"м/с"],
  ["Шанс крита",w.crit*100,reference.crit*100,1,"п.п."],
  ["Множитель крита",w.critPower,reference.critPower,2,"×"],
  ["Рикошеты",w.effect===3?1:0,reference.effect===3?1:0,0,""],
  ["Патроны в магазине",w.ammo,reference.ammo,0,""],
  ["Запас патронов",w.reserve,reference.reserve,0,""]
 ];
 for(const [label,value,other,digits,unit,lowerBetter=false] of fields){
  if(!Number.isFinite(value)||!Number.isFinite(other))continue;
  const difference=Number((
   Number(value.toFixed(digits))-Number(other.toFixed(digits))
  ).toFixed(digits));
  if(difference===0)continue;
  const row=document.createElement("div");
  row.className="weapon-stat";
  const name=document.createElement("span");
  name.textContent=label;
  const badge=document.createElement("span");
  const better=lowerBetter?difference<0:difference>0;
  badge.className="weapon-stat__value weapon-diff weapon-diff--"+
   (better?"better":"worse");
  const amount=Math.abs(difference).toLocaleString("ru-RU",{
   minimumFractionDigits:digits,maximumFractionDigits:digits
  });
  badge.textContent=(difference>0?"+":"−")+" "+amount+(unit?" "+unit:"");
  badge.title=better?"Лучше активного оружия":"Хуже активного оружия";
  row.append(name,badge);
  fragment.appendChild(row);
 }
 if(w.effect!==reference.effect){
  const effect=document.createElement("div");
  effect.className="weapon-effect";
  effect.textContent="Эффект: "+(EFFECTS[reference.effect]?.name||"Неизвестный")+
   " → "+(EFFECTS[w.effect]?.name||"Неизвестный");
  fragment.appendChild(effect);
 }
 if(!fragment.childNodes.length)message("Отличий нет.");
 return fragment;
}

function transferFloorWeapon(state,item,slot){
 if(!state||state.dead||(slot!==0&&slot!==1)||!item?.w||
    !Number.isFinite(dist(item,state.p))||dist(item,state.p)>INVENTORY_RADIUS)return false;
 const index=state.loot.indexOf(item);
 if(index<0||state.p.weapons.includes(item.w))return false;
 const old=state.p.weapons[slot];
 state.loot.splice(index,1);
 if(old)state.loot.push({x:state.p.x,y:state.p.y,w:old});
 state.p.weapons[slot]=item.w;
 state.p.reload=0;
 state.p.shot=Math.max(state.p.shot||0,.15);
 return true;
}

function dropHandWeapon(state,slot){

 const w=state.p.weapons[slot];
 if(!w)return false;
 state.loot.push({x:state.p.x,y:state.p.y,w});
 state.p.weapons[slot]=null;
 state.p.reload=0;
 state.p.shot=Math.max(state.p.shot||0,.15);
 return true;
}

function inFrontOfBuilding(point,building){
 return point.x>=building.x+building.w/2||

}
function sceneOccluder(item){
 if(item.type==="building")return item.value;
 if(item.type==="roomWall"||item.type==="caveWall"){
  return {x:item.value.x,y:item.value.y,w:1,h:1};
 }
 return null;
}
function sceneObjectBounds(item){
 const o=item.value;
 const x=(o.x-o.y)*32,y=(o.x+o.y)*16;
 if(item.type==="building"){
  const halfWidth=(o.w+o.h)*16,halfHeight=(o.w+o.h)*8;
  return {
   left:x-halfWidth-40,right:x+halfWidth+40,
   top:y-halfHeight-o.height-80,bottom:y+halfHeight+20
  };
 }
 if(item.type==="roomWall"||item.type==="caveWall"){
  return {left:x-33,right:x+33,top:y-64,bottom:y+18};
 }
 if(item.type==="medkit"||item.type==="armorVest"){
  return {left:x-16,right:x+16,top:y-26,bottom:y+8};
 }
 if(item.type==="floorWeapon"){
  // Включая длинный ствол, покачивание и значок редкости.
  return {left:x-30,right:x+36,top:y-48,bottom:y+10};
 }
 const actor=item.type==="actor"||item.type==="player";
 const scale=actor?enemyScale(o):
  Number.isFinite(o.size)&&o.size>0?o.size:1;
 const z=Number.isFinite(o.z)?o.z:0;
 return {
  left:x-80*scale,right:x+80*scale,
  top:y-z-110*scale,bottom:y-z+45*scale
 };
}
function sortSceneObjects(objects){
 objects.sort((a,b)=>a.depth-b.depth);
 const footprints=objects.map(sceneOccluder);
 const buildings=[];
 for(let i=0;i<objects.length;i++){
  if(footprints[i])buildings.push(i);
 }
 if(!buildings.length)return objects;
 const bounds=objects.map(sceneObjectBounds);
 const edges=Array.from({length:objects.length},()=>[]);
 const incoming=new Int32Array(objects.length);
 const connect=(from,to)=>{
  edges[from].push(to);
  incoming[to]++;
 };
 const overlaps=(a,b)=>a.left<=b.right&&a.right>=b.left&&
  a.top<=b.bottom&&a.bottom>=b.top;
 for(const i of buildings){
  const building=footprints[i];
  for(let j=0;j<objects.length;j++){
   if(i===j||!overlaps(bounds[i],bounds[j]))continue;
   const other=objects[j];
   if(footprints[j]){
    if(j<i)continue;
    const b=footprints[j];
    const before=building.x+building.w/2<=b.x-b.w/2||
     building.y+building.h/2<=b.y-b.h/2;
    const after=b.x+b.w/2<=building.x-building.w/2||
     b.y+b.h/2<=building.y-building.h/2;
    // Диагонально разнесённые дома не навязывают друг другу порядок.
    if(before&&!after)connect(i,j);
    else if(after&&!before)connect(j,i);
   }else if(inFrontOfBuilding(other.value,building)){
    connect(i,j);
   }else{
    connect(j,i);
   }
  }
 }
 // Топологическая сортировка. Среди доступных объектов сохраняем
 // приоритет исходной глубины, а не используем нетранзитивный comparator.
 const ready=[],done=new Uint8Array(objects.length),ordered=[];
 const push=index=>{
  let at=ready.length;
  ready.push(index);
  while(at>0){
   const parent=(at-1)>>1;
   if(ready[parent]<=index)break;
   ready[at]=ready[parent];at=parent;
  }
  ready[at]=index;
 };
 const pop=()=>{
  const first=ready[0],last=ready.pop();
  if(ready.length){
   let at=0;
   while(at*2+1<ready.length){
    let child=at*2+1;
    if(child+1<ready.length&&ready[child+1]<ready[child])child++;
    if(ready[child]>=last)break;
    ready[at]=ready[child];at=child;
   }
   ready[at]=last;
  }
  return first;
 };
 for(let i=0;i<objects.length;i++)if(incoming[i]===0)push(i);
 while(ordered.length<objects.length){
  // При противоречивом перекрытии крупных силуэтов не теряем объекты
  // и не зависаем: выбираем оставшийся объект с прежним приоритетом.
  let index;
  if(ready.length)index=pop();
  else index=done.findIndex(value=>value===0);
  if(done[index])continue;
  done[index]=1;
  ordered.push(objects[index]);
  for(const next of edges[index]){
   if(!done[next]&&--incoming[next]===0)push(next);
  }
 }
 for(let i=0;i<ordered.length;i++)objects[i]=ordered[i];
 return objects;
}

function testFixedCameraView(){
 const results=[];
 const check=(name,ok)=>results.push({name,ok:Boolean(ok)});
 const near=(a,b)=>Math.abs(a-b)<1e-7;
 const sizes=[
  [800,600],[1024,768],[1280,720],[1280,1024],[1366,768],
  [1440,900],[1600,900],[1920,1080],[1920,1200],
  [2560,1440],[2560,1600],[3440,1440],[3840,2160],
  [5120,1440],[390,844]
 ];
 let fitOK=true,viewOK=true,inputOK=true,spawnOK=true,areaOK=true;
 let nativeOK=true,budgetOK=true;
 const hero={x:0,y:0},oldW=W,oldH=H;
 try{
  for(const [width,height] of sizes){
   const reference=gameViewportSize(width,height);
   if(reference.logicalWidth>GAME_VIEW.maxWidth+1e-7||
      reference.logicalHeight>GAME_VIEW.maxHeight+1e-7||
      reference.logicalWidth*reference.logicalHeight>
       GAME_VIEW.width*GAME_VIEW.height+1e-7)areaOK=false;
   for(const browserZoom of [.25,.5,1,1.25,2,5]){
    const cw=width/browserZoom,ch=height/browserZoom;
    const view=gameViewportSize(cw,ch);
    W=view.logicalWidth;H=view.logicalHeight;
    if(!near(view.width,cw)||!near(view.height,ch)||
       !near(W/H,cw/ch)||!near(cw/W,ch/H))fitOK=false;
    if(!near(W,reference.logicalWidth)||!near(H,reference.logicalHeight)){
     viewOK=false;
    }
    const rect={left:7,top:11,width:cw,height:ch};
    for(const [x,y] of [[0,0],[W/2,H/2],[W,H],[W*.8,H*.3]]){
     const point=canvasInputPoint(
      rect.left+x*view.scale,rect.top+y*view.scale,rect
     );
     const scene=cameraInputPoint(point.x,point.y);
     if(!near(point.x,x)||!near(point.y,y)||
        !near(scene.x,W/2+(x-W/2)/CFG.cameraZoom)||
        !near(scene.y,H/2+(y-H/2)/CFG.cameraZoom))inputOK=false;
    }
    // Проверяем обе стороны каждой границы с учётом запаса спавна.
    const margin=96*CFG.cameraZoom;
    for(const [sx,sy] of [[1,0],[-1,0],[0,1],[0,-1]]){
     for(const delta of [-1,1]){
      const px=sx*(W/2+margin+delta)/CFG.cameraZoom;
      const py=sy*(H/2+margin+delta)/CFG.cameraZoom;
      const point={x:px/64+py/32,y:-px/64+py/32};
      if(npcSpawnOutsideView(point,hero)!==(delta>0))spawnOK=false;
     }
    }
    // При zoom страницы CSS-размер и DPR меняются обратно пропорционально.
    const buffer=gameBufferSize(cw,ch,browserZoom);
    if(Math.abs(buffer.width-width)>1||Math.abs(buffer.height-height)>1){
     nativeOK=false;
    }
   }
   for(const dpr of [1,1.25,1.5,2,3,4]){
    const buffer=gameBufferSize(width,height,dpr);
    if(buffer.width*buffer.height>GAME_VIEW.maxPixels||
       buffer.width>GAME_VIEW.maxBufferSide||
       buffer.height>GAME_VIEW.maxBufferSide)budgetOK=false;
    if(width*height*dpr*dpr<=GAME_VIEW.maxPixels&&
       Math.max(width,height)*dpr<=GAME_VIEW.maxBufferSide&&
       (Math.abs(buffer.width-width*dpr)>1||
        Math.abs(buffer.height-height*dpr)>1))nativeOK=false;
   }
  }
 }finally{
  W=oldW;H=oldH;
 }
 check("Популярные разрешения заполняют окно без полей и искажения",fitOK);
 check("Масштаб страницы 25–500% не меняет обзор при тех же пропорциях",viewOK);
 check("Площадь обзора и дальность на крайних пропорциях ограничены",areaOK);
 check("Курсор совпадает с изображением при всех проверяемых размерах",inputOK);
 check("Спавн за каждой границей использует актуальный кадр",spawnOK);
 check("Буфер соответствует DPR с погрешностью округления до 1 пикселя",nativeOK);
 check("Буфер не превышает лимит площади и длины стороны",budgetOK);
 const base=gameViewportSize(1600,900);
 check("Базовый вид 1600×900 сохранён",
  near(base.logicalWidth,1600)&&near(base.logicalHeight,900)&&near(base.scale,1));
 check("Некорректные размеры и DPR не создают NaN",
  [0,-1,NaN,Infinity].every(value=>{
   const view=gameViewportSize(value,value);
   const buffer=gameBufferSize(value,value,value);
   return Number.isFinite(view.scale)&&view.scale>0&&
    Number.isFinite(view.logicalWidth)&&Number.isFinite(view.logicalHeight)&&
    buffer.width>=1&&buffer.height>=1;
  }));
 return results;
}

     dist(m.start,{x:m.n/2,y:m.n/2})<m.n*.4||
     Math.min(m.start.x,m.start.y,m.n-m.start.x,m.n-m.start.y)>m.n*.15){

  regions.add(m.layout?.mode);
  const landmarks=m.landmarks||[];
  if(landmarks.length<3||new Set(landmarks.map(o=>o.kind)).size<3)landmarksOK=false;
  for(const o of landmarks){
   objectTypes.add(o.kind);
   if(!Number.isFinite(o.size)||o.size<=0||
      m.tiles[Math.floor(o.y)*m.n+Math.floor(o.x)]!==0||
      dist(o,m.start)<=10||dist(o,m.exit)<=10)landmarksOK=false;
  }
  for(const p of [m.start,m.exit]){
   const cx=Math.floor(p.x),cy=Math.floor(p.y);

function loadRun(){
 try{
  const raw=localStorage.getItem("prism-save");
  if(!raw){toast("Нет сохранённого забега");return}
  stopGameSounds();
  S=JSON.parse(raw);
  if(!S.map||!S.p||!validateMap(S.map))throw Error("Формат");
  S.npcKills=npcKillCount(S);
  normalizeStamina(S);
  normalizeArmor(S);
  normalizeCapDrops(S);
  capPickupSoundWait=0;
  if(!Array.isArray(S.p.weapons)||S.p.weapons.length!==2)throw Error("Слоты оружия");
  S.p.weapons=S.p.weapons.map(w=>w??null);
  if(S.p.slot!==0&&S.p.slot!==1)S.p.slot=0;
  if(!activeWeapon())S.p.reload=0;
  for(const e of S.enemies){
   normalizeDonkey(e,S.level);
   equipEnemy(e);
  }
  S.medkits=Array.isArray(S.medkits)?S.medkits.filter(m=>
   m&&Number.isFinite(m.x)&&Number.isFinite(m.y)&&!wall(m.x,m.y)
  ):[];
  S.p.heal=Number.isFinite(S.p.heal)
   ?clamp(S.p.heal,0,CFG.medkitSeconds):0;
  serial=normalizeHouseWorld(S);pathTimer=0;
  combatVisuals=null;
  if(S.pending)caseWindow();else if(S.between)betweenWindow();else closeModal();
 }catch{toast("Не удалось загрузить сохранение")}
}

addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT")return;
 if(e.target instanceof Element&&e.target.closest("button")&&
    (e.code==="Space"||e.code==="Enter"))return;
 if(e.code==="Tab"&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.shiftKey){
  const inventoryOpen=paused&&$("#inventoryRoot")&&
   !$("#modal").classList.contains("hidden");
  if(S&&!S.dead&&!S.between&&(!paused||inventoryOpen)){
   e.preventDefault();
   if(!e.repeat){
    if(inventoryOpen)closeModal();
    else inventoryWindow();
   }
   return;
  }
 }
 if(["Space","KeyW","KeyA","KeyS","KeyD"].includes(e.code))e.preventDefault();
 if(e.repeat)return;
 keys[e.code]=true;
 if(e.code==="Escape"){
  if(paused&&$("#aboutGame")){
   menu();
   $("#about").focus({preventScroll:true});
   return;
  }
  if(paused&&S&&!S.dead&&!S.between)closeModal();else pauseWindow();
  return;
 }
 if(!S||paused)return;
 if(e.code==="KeyR")reload();
 if(e.code==="KeyQ")switchWeapon();
 if(e.code==="Digit1")switchWeapon(0);
 if(e.code==="Digit2")switchWeapon(1);
 if(e.code==="KeyE")interact();
});
addEventListener("keyup",e=>keys[e.code]=false);

},{passive:false,capture:true});

function frame(now){
 const realDt=Math.max(0,(now-lastTime)/1000);lastTime=now;
 const dt=Math.min(.033,realDt);

 shotShake=Math.max(0,shotShake-dt*24);
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$("#toast").textContent=""}

}

      facade:"plaster",door:"small",detail:"parapet",sign:""},
    {id:"shack",name:"Дощатая лачуга",roof:"shed",rise:14,height:32,
      facade:"boards",door:"small",detail:"none",sign:""},
    {id:"cottage",name:"Жилой дом",roof:"gable",rise:25,height:43,
      facade:"plaster",door:"small",detail:"chimney",sign:""},
    {id:"warehouse",name:"Склад",roof:"gable",rise:20,height:49,
      facade:"metal",door:"shutter",detail:"vents",sign:"СКЛАД"},
    {id:"container",name:"Контейнерный дом",roof:"flat",rise:0,height:31,
      facade:"metal",door:"double",detail:"none",sign:""},
    {id:"workshop",name:"Мастерская",roof:"shed",rise:12,height:42,
      facade:"boards",door:"shutter",detail:"pipes",sign:"РЕМОНТ"},
    {id:"relay",name:"Радиопост",roof:"flat",rise:0,height:45,
      facade:"plaster",door:"small",detail:"antenna",sign:"СВЯЗЬ"},
    {id:"pump",name:"Насосная",roof:"flat",rise:0,height:37,
      facade:"metal",door:"small",detail:"tank",sign:"ВОДА"}
  ];

  const BUILDING_TONES = [
    {wall:"#b6a07b",edge:"#79674f",roof:"#986449"},
    {wall:"#a49b83",edge:"#696959",roof:"#777b6b"},
    {wall:"#bcaa8c",edge:"#81705e",roof:"#927a62"},
    {wall:"#a78666",edge:"#705441",roof:"#8d5840"}
  ];
  const styledMaps = new WeakSet();

  function ensureBuildingStyles(map){
    if(styledMaps.has(map))return;
    const buildings=map.buildings||[];
    const r=rng(hash(map.seed+":architecture:v1"));
    let bag=[],changed=false;

    for(const b of buildings){
      if(b.kind==="cave")continue;
      if(!bag.length)bag=shuffle(r,BUILDING_STYLES.map(s=>s.id));
      const type=bag.pop();
      const tone=Math.floor(r()*BUILDING_TONES.length);
      const boarded=r()<.4;
      const heightOffset=Math.floor(r()*10);

      if(b.arch&&BUILDING_STYLES.some(s=>s.id===b.arch.type))continue;
      const style=BUILDING_STYLES.find(s=>s.id===type);
      b.arch={type,tone,boarded,sign:false};
      b.height=style.height+heightOffset;
      changed=true;
    }

    if(changed){
      for(const b of buildings)b.arch.sign=false;
      const candidates=shuffle(r,buildings.filter(b=>
        b.kind!=="cave"&&b.w>=3&&BUILDING_STYLES.find(s=>s.id===b.arch.type).sign
      ));
      const limit=Math.floor(buildings.length*CFG.buildingSignFraction);
      for(const b of candidates.slice(0,limit))b.arch.sign=true;
    }
    styledMaps.add(map);
  }

  const REGION_PROFILES=[
    {name:"Караванные дюны",density:.55,mode:0,decor:[0,2,4],special:[5,6,7]},
    {name:"Промышленный узел",density:1.65,mode:1,decor:[1,3,4],special:[8,9,10]},
    {name:"Высохший оазис",density:.9,mode:2,decor:[0,1,2],special:[11,12,13]},
    {name:"Разбитый пригород",density:2.2,mode:3,decor:[1,3,4],special:[14,15,16]}
  ];

  generateMap = function(seed, level) {
    const r = rng(seed);
    // Прежняя стартовая карта: 159×159. Меняем площадь, не масштаб клетки.
    const previousStartSize=Math.round(Math.round(65*Math.SQRT2)*Math.sqrt(3));
    const n = Math.round(previousStartSize*Math.sqrt(.2*Math.pow(1.03,level-1)));
    // Профили соседних уровней различаются независимо от случайного seed.
    const profile=REGION_PROFILES[(level-1)%REGION_PROFILES.length];
    const layout={
      name:profile.name,mode:profile.mode,
      density:profile.density*(.92+r()*.16),
      angle:r()*Math.PI*2,
      phase:r()*Math.PI*2,
      offset:(r()-.5)*n*.16,
      width:2.5+r()*2
    };
    const ca=Math.cos(layout.angle),sa=Math.sin(layout.angle);
    const settlements=Array.from({length:3},()=>({
      x:n*(.2+r()*.6),y:n*(.2+r()*.6)
    }));

    const map = {
      seed,
      n,
      tiles: Array(n * n).fill(0),
      seen: Array(n * n).fill(false),
      buildings: [],
      decor: [],
      terrain: Array(n * n).fill(0),
      start: { x: 2.5, y: 2.5 },
      shops: [],
      desert: true,
      layout,
      landmarks: []
    };

    // Неровная на вид, но непрерывная внешняя граница.
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        if (x === 0 || y === 0 || x === n - 1 || y === n - 1) {
          map.tiles[y * n + x] = 1;
        }

        // Поворот, изгибы и схема дорог меняются вместе с регионом.
        const dx=x-n/2,dy=y-n/2;
        const u=dx*ca-dy*sa,v=dx*sa+dy*ca;
        const wave=Math.sin(u*.06+layout.phase)*n*.045;
        let road1,road2,wash;
        if(layout.mode===0){
          road1=Math.abs(v-wave-layout.offset);
          road2=n;
          wash=Math.abs(v+wave+n*.23);
        }else if(layout.mode===1){
          road1=Math.abs(v-layout.offset);
          road2=Math.abs(u+Math.sin(v*.045+layout.phase)*8);
          wash=Math.abs(v-u*.4+n*.3);
        }else if(layout.mode===2){
          road1=Math.abs(Math.hypot(u,v)-n*.27);
          road2=Math.abs(v-wave);
          wash=Math.hypot(u,v)<n*.19?0:n;
        }else{
          road1=Math.abs(((v+n*2)%(n*.19))-n*.095);
          road2=Math.abs(((u+n*2)%(n*.23))-n*.115);
          wash=Math.abs(v-u*.6-layout.offset);
        }
        if(wash<5)map.terrain[y*n+x]=3;
        if(road1<layout.width)map.terrain[y*n+x]=1;
        if(road2<layout.width)map.terrain[y*n+x]=2;
      }
    }

    // Отдельные компактные здания, а не сплошные стены лабиринта.
    // Между зданиями оставляем минимум несколько клеток.
    const targetBuildings = Math.min(340,
      Math.round((n*n/210+Math.min(level,100)*.5)*layout.density));

    for (let attempt = 0;
      attempt < 4500 && map.buildings.length < targetBuildings;
      attempt++) {

      const w = 2 + Math.floor(r() * 4);
      const h = 2 + Math.floor(r() * 3);
      let x = 7 + Math.floor(r() * (n - w - 12));
      let y = 7 + Math.floor(r() * (n - h - 12));
      if(layout.mode===0||layout.mode===2){
        const center=pick(r,settlements);
        x=clamp(Math.floor(center.x+(r()-.5)*n*.25),7,n-w-7);
        y=clamp(Math.floor(center.y+(r()-.5)*n*.25),7,n-h-7);
      }

      let fits = true;

      for (let yy = y - 3; yy < y + h + 3 && fits; yy++) {
        for (let xx = x - 3; xx < x + w + 3; xx++) {
          const k = yy * n + xx;

          if (
            xx < 1 || yy < 1 || xx >= n - 1 || yy >= n - 1 ||
            map.tiles[k] || map.terrain[k] === 1 || map.terrain[k] === 2
          ) {
            fits = false;
            break;
          }
        }
      }

      if (!fits) continue;

      const building = {
        x: x + w / 2,
        y: y + h / 2,
        w,
        h,
        height: 37 + Math.floor(r() * 34),
        kind: Math.floor(r() * 3),
        sign: pick(r, ["МОТЕЛЬ", "МАСЛО", "СКЛАД", "ВОДА", "ДЕПО"]),
        variant: r()
      };

      map.buildings.push(building);

      for (let yy = y; yy < y + h; yy++) {
        for (let xx = x; xx < x + w; xx++) {
          map.tiles[yy * n + xx] = 1;
        }
      }
    }

    // shopClear проверяет свободную площадку 5×5, включая отступ от границы.
    const spawnSpots = [];
    for (let y = 3; y < n - 3; y++) {
      for (let x = 3; x < n - 3; x++) {
        const p = { x: x + .5, y: y + .5 };
        const edge=Math.min(p.x,p.y,n-p.x,n-p.y);
        if(edge<=n*.15&&dist(p,{x:n/2,y:n/2})>=n*.4&&shopClear(p)){
          spawnSpots.push(p);
        }
      }
    }
    if (!spawnSpots.length) throw Error("Нет свободной площадки для старта");
    map.start = { ...pick(r, spawnSpots) };

    // Расстояния и достижимость считаются от фактического старта.
    const d = distances(map, Math.floor(map.start.x), Math.floor(map.start.y));
    const floors = [];

    for (let y = 1; y < n - 1; y++) {
      for (let x = 1; x < n - 1; x++) {
        if (d[y * n + x] >= 0) {
          floors.push({
            x: x + .5,
            y: y + .5,
            d: d[y * n + x]
          });
        }
      }
    }

    floors.sort((a, b) => b.d - a.d);
    const clearFloors = floors.filter(shopClear);
    const exitSpots = clearFloors.filter(p => dist(p, map.start) >= n * .7);
    if(!exitSpots.length)throw Error("Нет дальней площадки для эвакуации");
    // Сначала выбираем направление, затем точку: большие сектора не доминируют.
    const sectors=Array.from({length:8},()=>[]);
    for(const p of exitSpots){
      const angle=Math.atan2(p.y-map.start.y,p.x-map.start.x)+Math.PI;
      const sector=Math.floor(angle/(Math.PI*2)*8)%8;
      sectors[sector].push(p);
    }
    map.exit={...pick(r,pick(r,sectors.filter(s=>s.length)))};

    // Старту, эвакуации и магазинам нужны свободные площадки.
    function shopClear(p) {
      const x = Math.floor(p.x);
      const y = Math.floor(p.y);

      for (let yy = y - 2; yy <= y + 2; yy++) {
        for (let xx = x - 2; xx <= x + 2; xx++) {
          if (
            xx <= 0 || yy <= 0 || xx >= n - 1 || yy >= n - 1 ||
            map.tiles[yy * n + xx]
          ) return false;
        }
      }

      return true;
    }

    const candidates = shuffle(
      r,
      floors.filter(p =>
        p.d > 15 &&
        p.d < floors[0].d * .85 &&
        dist(p, map.exit) > 9 &&
        shopClear(p)
      )
    );

    if (r() < CFG.weaponShopChance && candidates.length) {
      map.shops.push({ ...candidates.shift(), kind: "weapons" });
    }

    if (r() < CFG.upgradeShopChance) {
      const p = candidates.find(p =>
        map.shops.every(s => dist(s, p) > 15)
      );

      if (p) map.shops.push({ ...p, kind: "upgrades" });
    }

    // Три гарантированных объекта разных типов, далеко друг от друга.
    const landmarkSpots=shuffle(r,clearFloors.filter(p=>
      dist(p,map.start)>10&&dist(p,map.exit)>10&&
      map.shops.every(s=>dist(s,p)>8)
    ));
    for(const kind of profile.special){
      const p=landmarkSpots.find(p=>map.landmarks.every(o=>dist(o,p)>12));
      if(!p)throw Error("Нет площадки для тематического объекта");
      map.landmarks.push({
        x:p.x,y:p.y,kind,size:1.5+r()*.5,flip:1,
        label:`${level}-${map.landmarks.length+1}`,
        variant:Math.floor(r()*3)
      });
    }

    // Декор не блокирует движение: визуальные камни и обломки.
    // Настоящие укрытия — здания и разрушаемые объекты основной игры.
    const decorationSpots = shuffle(
      r,
      floors.filter(p =>
        dist(p, map.start) > 4 &&
        dist(p, map.exit) > 3 &&
        map.shops.every(s => dist(s, p) > 3) &&
        map.landmarks.every(s => dist(s, p) > 3) &&
        map.terrain[Math.floor(p.y)*n+Math.floor(p.x)] !== 1
      )
    );

    const decorCount=Math.min(2600,Math.round(n*n*.035*layout.density));
    for (let i = 0; i < Math.min(decorCount, decorationSpots.length); i++) {
      const p = decorationSpots[i];

      map.decor.push({
        x: p.x + (r() - .5) * .3,
        y: p.y + (r() - .5) * .3,
        kind: pick(r,profile.decor),
        size: .7 + r() * .7,
        flip: r() > .5 ? 1 : -1
      });
    }

    ensureBuildingStyles(map);
    map.floors = floors;
    addCaveEntrance(map);
    return map;
  };

  // ---------------- Вспомогательная графика ----------------

  function ink(points, fill, width = 2) {
    ctx.beginPath();
    points.forEach((p, i) =>
      i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)
    );
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = "#342c25";
    ctx.lineWidth = width;
    ctx.stroke();
  }

  function strokeLine(x1, y1, x2, y2, color, width = 2) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function visible(x, y, margin = 150) {
    const p = project(x, y),zoom=CFG.cameraZoom;
    const screenX=W/2+(p.x-W/2)*zoom;
    const screenY=H/2+(p.y-H/2)*zoom;
    const padding=margin*zoom;
    return screenX > -padding && screenX < W + padding &&
      screenY > -padding && screenY < H + padding;
  }

  const portalLabelQueue=[];
  const portalLabelLayer=document.getElementById("portalLabels");

  function queuePortalLabel(label,x,y){
    // Сохраняем экранную позицию с текущим zoom, DPR и тряской камеры.
    const matrix=ctx.getTransform();
    portalLabelQueue.push({
      label,
      x:(matrix.a*x+matrix.c*y+matrix.e)/canvas.width,
      y:(matrix.b*x+matrix.d*y+matrix.f)/canvas.height
    });
  }

  function flushPortalLabels(){
    const shown=Boolean(S&&!paused&&!S.dead&&portalLabelQueue.length);
    portalLabelLayer.hidden=!shown;
    if(!shown)return;
    const rect=canvas.getBoundingClientRect();
    while(portalLabelLayer.childElementCount>portalLabelQueue.length){
      portalLabelLayer.lastElementChild.remove();
    }
    portalLabelQueue.forEach((entry,index)=>{
      let node=portalLabelLayer.children[index];
      if(!node){
        node=document.createElement("span");
        portalLabelLayer.appendChild(node);
      }
      if(node.textContent!==entry.label)node.textContent=entry.label;
      node.style.left=(rect.left+entry.x*rect.width)+"px";
      node.style.top=(rect.top+entry.y*rect.height)+"px";
    });
  }

  function drawCaveEntrance(b){
    const p=project(b.x,b.y);
    ctx.save();
    ellipse(p.x,p.y+6,36,15,"#302a2455");
    ink([
      {x:p.x-34,y:p.y+2},{x:p.x-27,y:p.y-24},
      {x:p.x-10,y:p.y-40},{x:p.x+13,y:p.y-36},
      {x:p.x+32,y:p.y-15},{x:p.x+30,y:p.y+8},
      {x:p.x+3,y:p.y+18}
    ],"#827866",2.5);
    ink([
      {x:p.x-27,y:p.y-24},{x:p.x-10,y:p.y-40},
      {x:p.x+13,y:p.y-36},{x:p.x+2,y:p.y-19}
    ],"#a39881",1.5);
    const mouth=project(b.x,b.y+b.h/2);
    ellipse(mouth.x,mouth.y-10,13,18,"#342d25");
    ellipse(mouth.x,mouth.y-8,10,15,"#090a09");
    strokeLine(mouth.x-12,mouth.y+7,mouth.x+11,mouth.y+7,"#b0a184",3);
    const door=houseDoor(b);
    if(dist(S.p,door)<=1.15&&S.p.y>=b.y+b.h/2+.2&&
       valid(door.x,door.y)&&lineClear(S.p,door)){
      queuePortalLabel("E — ПЕЩЕРА",p.x,p.y-49);
    }
    ctx.restore();
  }

  function drawCaveWall(o,map){
    const p=project(o.x,o.y);
    const front=o.ix>map.interior.width/2||o.iy>map.interior.height/2;
    const height=front?10:32+(o.ix*7+o.iy*11)%13;
    ink([
      {x:p.x-31,y:p.y},{x:p.x-23,y:p.y-height},
      {x:p.x-4,y:p.y-height-7},{x:p.x+23,y:p.y-height+4},
      {x:p.x+31,y:p.y},{x:p.x,y:p.y+15}
    ],front?"#756c5b":"#625d50",1.5);
    strokeLine(p.x-17,p.y-height+2,p.x-4,p.y-height-4,"#a1967c",2);
  }

  function drawBuilding(b, theme) {
    if(b.kind==="cave"){drawCaveEntrance(b);return}
    const style=BUILDING_STYLES.find(s=>s.id===b.arch?.type)||BUILDING_STYLES[0];
    const tone=BUILDING_TONES[b.arch?.tone]||BUILDING_TONES[0];
    const point=(u,v,z=0)=>project(
      b.x-b.w/2+b.w*u,
      b.y-b.h/2+b.h*v,
      z
    );
    const roofHeight=v=>b.height+(
      style.roof==="gable"?style.rise*(1-Math.abs(v*2-1)):
      style.roof==="shed"?style.rise*(1-v):0
    );
    const roofPoint=(u,v)=>point(u,v,roofHeight(v));
    const a = project(b.x - b.w / 2, b.y - b.h / 2);
    const c = project(b.x + b.w / 2, b.y + b.h / 2);
    const right = project(b.x + b.w / 2, b.y - b.h / 2);
    const left = project(b.x - b.w / 2, b.y + b.h / 2);

    const up = p => ({ x: p.x, y: p.y - b.height });
    const pp = project(S.p.x, S.p.y);

    const minX = Math.min(a.x, c.x, left.x, right.x);
    const maxX = Math.max(a.x, c.x, left.x, right.x);

    // Грубая проверка перекрытия игрока экранным силуэтом здания.
    const blocksPlayer =
      pp.x > minX - 12 && pp.x < maxX + 12 &&
      pp.y - 15 > a.y - b.height - style.rise - 45 && pp.y - 15 < c.y &&
      !inFrontOfBuilding(S.p,b);

    ctx.save();
    if (blocksPlayer) ctx.globalAlpha = .27;

    // Тень.
    poly([
      left, c,
      { x: c.x + 35, y: c.y + 13 },
      { x: left.x + 35, y: left.y + 13 }
    ], "#45382435");

    ink([right, c, up(c), up(right)], tone.edge);
    ink([c, left, up(left), up(c)], tone.wall);

    if(style.roof==="gable"){
      // Торцевой фронтон и два ската с общим коньком.
      ink([up(right),up(c),roofPoint(1,.5)],tone.wall);
      ink([
        roofPoint(0,0),roofPoint(1,0),
        roofPoint(1,.5),roofPoint(0,.5)
      ],tone.roof,2.5);
      ink([
        roofPoint(0,.5),roofPoint(1,.5),
        roofPoint(1,1),roofPoint(0,1)
      ],theme.edge,2.5);
    }else{
      if(style.roof==="shed"){
        ink([up(right),up(c),roofPoint(1,0)],tone.edge);
      }
      ink([
        roofPoint(0,0),roofPoint(1,0),
        roofPoint(1,1),roofPoint(0,1)
      ],tone.roof,2.5);
    }

    // Швы повторяют реальную форму крыши, включая конёк.
    if(style.detail!=="parapet"){
      for(let i=1;i<b.w*3;i++){
        const u=i/(b.w*3);
        const p1=roofPoint(u,0),pm=roofPoint(u,.5),p2=roofPoint(u,1);
        strokeLine(p1.x,p1.y,pm.x,pm.y,"#342c254f",1);
        strokeLine(pm.x,pm.y,p2.x,p2.y,"#342c254f",1);
      }
    }

    // Фактура переднего фасада: доски, гофра или штукатурка.
    if(style.facade==="boards"){
      for(let z=7;z<b.height;z+=8){
        const p1=point(0,1,z),p2=point(1,1,z);
        strokeLine(p1.x,p1.y,p2.x,p2.y,"#51402c70",1);
      }
    }else if(style.facade==="metal"){
      for(let i=1;i<b.w*5;i++){
        const u=i/(b.w*5);
        const p1=point(u,1,2),p2=point(u,1,b.height-2);
        strokeLine(p1.x,p1.y,p2.x,p2.y,"#3e3d3655",1);
      }
    }else{
      const crack=[point(.15,1,b.height*.8),point(.19,1,b.height*.55),point(.13,1,b.height*.35)];
      strokeLine(crack[0].x,crack[0].y,crack[1].x,crack[1].y,"#68564080",1);
      strokeLine(crack[1].x,crack[1].y,crack[2].x,crack[2].y,"#68564080",1);
    }

    // Все проёмы лежат в плоскости фасада, а не экрана.
    function facadePanel(u0,u1,z0,z1,color){
      ink([
        point(u0,1,z0),point(u1,1,z0),
        point(u1,1,z1),point(u0,1,z1)
      ],color,1.5);
    }

    const wide=style.door!=="small";
    const doorLeft=wide?.30:.44,doorRight=wide?.70:.56;
    const doorHeight=Math.min(b.height-7,wide?31:25);
    facadePanel(doorLeft,doorRight,0,doorHeight,
      style.door==="shutter"?"#727266":"#413b32");

    if(style.door==="shutter"){
      for(let z=5;z<doorHeight;z+=5){

    const entrance=houseDoor(b);

       valid(entrance.x,entrance.y)&&lineClear(S.p,entrance)){

    if(style.detail==="pipes"){
      for(const u of [.25,.4]){

  // ---------------- Персонажи ----------------

// Временное состояние анимации.
// Не попадает в сохранения и отдельно хранится для каждого персонажа.
const actorWalkStates = new WeakMap();

npcHitPath=function(a){
 if(mutantType(a))return mutantHitPath(a);
 if(a.bossKind==="donkey")return donkeyHitPath(a);
 const path=new Path2D(),t=ENEMY_TYPES[a.type];
 const behavior=enemyBehaviorStates.get(a);
 const mode=!a.boss&&behavior?.map===S?.map?behavior.mode:"";
 const sitting=mode==="sit",offset=sitting?13:0;
 const oval=(x,y,rx,ry)=>{
  path.moveTo(x+rx,y);
  path.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  path.closePath();
 };
 const polygon=points=>{
  // Единое направление обхода: перекрытия частей не создают дыр.
  let area=0;
  for(let i=0;i<points.length;i++){
   const p=points[i],q=points[(i+1)%points.length];
   area+=p[0]*q[1]-q[0]*p[1];
  }
  if(area<0)points=[...points].reverse();
  path.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++)path.lineTo(points[i][0],points[i][1]);
  path.closePath();
 };
 const rect=(x,y,w,h)=>polygon([[x,y],[x+w,y],[x+w,y+h],[x,y+h]]);
 const limb=(x1,y1,x2,y2,width)=>{
  const radius=width/2,dx=x2-x1,dy=y2-y1,length=Math.hypot(dx,dy);
  if(length>0){
   const nx=-dy/length*radius,ny=dx/length*radius;
   polygon([[x1+nx,y1+ny],[x2+nx,y2+ny],
    [x2-nx,y2-ny],[x1-nx,y1-ny]]);
  }
  oval(x1,y1,radius,radius);
  oval(x2,y2,radius,radius);
 };

 // Ноги используют ту же фазу и направление, что и отрисовка.
 const walk=actorWalkStates.get(a);
 const blend=walk?.blend||0,phase=walk?.phase||0;
 for(const side of [-1,1]){
  if(sitting){
   const leg=seatedLegPose(a,side);
   limb(leg.hipX,leg.hipY,leg.kneeX,leg.kneeY,8);
   limb(leg.kneeX,leg.kneeY,leg.footX,leg.footY,7);
   limb(leg.footX,leg.footY,leg.toeX,leg.footY,5);
  }else{
   const legPhase=phase+(side===1?Math.PI:0);
   const swing=Math.sin(legPhase)*6*blend;
   const lift=Math.max(0,Math.cos(legPhase))*4*blend;
   const hipX=side*5;
   const footX=side*7+(walk?.dirX??1)*swing;
   const footY=(walk?.dirY??0)*swing-lift;
   const kneeX=hipX+(footX-hipX)*.55;
   const kneeY=-6+footY*.45-lift*.25;
   limb(hipX,-11,kneeX,kneeY,7);
   limb(kneeX,kneeY,footX,footY,6);
   limb(footX-2,footY,footX+3,footY,5);
  }
 }

 polygon([[-8,-29+offset],[8,-29+offset],[12,-8+offset],[-12,-8+offset]]);
 oval(0,-34+offset,8,9);
 if(t.shape===2){
  limb(-12,-42+offset,12,-42+offset,4);
  rect(-7,-49+offset,14,8);
 }else rect(-8,-43+offset,16,5);
 if(t.shape===1){
  polygon([[-14,-29+offset],[-5,-29+offset],[-7,-19+offset],[-16,-21+offset]]);
  polygon([[6,-29+offset],[14,-28+offset],[16,-21+offset],[7,-20+offset]]);
 }
 if(t.role===0)limb(-8,-30+offset,9,-28+offset,3);
 if(t.role===1)rect(-10,-44+offset,20,5);
 if(t.role===4)rect(-11,-28+offset,22,18);

 if(mode){
  const arm=(side,x,y)=>{
   limb(side*8,-25+offset,side*12,-18+offset,5);
   limb(side*12,-18+offset,x,y+offset,4);
   oval(x,y+offset,2.2,2.2);
  };
  const time=behavior.idleTime%20;
  if(mode==="smoke"){
   const lift=.5-.5*Math.cos(time*1.7);
   const x=12-8*lift,y=-17-15*lift;
   arm(1,x,y);arm(-1,-10,-12);
   limb(x,y+offset,x+6,y-1+offset,2);
  }else if(mode==="eat"){
   const take=clamp((time-.25)/1.1,0,1);
   const x=-10+4*take,y=-10-10*take;
   arm(-1,x,y+2);
   if(time>.25){
    rect(x-4,y-3+offset,8,9);
    oval(x,y-3+offset,4,2);
   }
   const bite=time<1.5?0:.5-.5*Math.cos((time-1.5)*2.8);
   const hx=8-6*bite,hy=-18-13*bite;
   arm(1,hx,hy);
   limb(hx,hy+offset,hx-3,hy-3+offset,1.5);
   oval(hx-3,hy-3+offset,1.5,1);
  }else if(mode==="drink"){
   const pose=vodkaPose(time);
   arm(-1,-10,-12);
   arm(1,pose.x,pose.y);
   polygon(vodkaBottlePoints(pose).map(([x,y])=>[x,y+offset]));
  }else{
   arm(-1,-12,-12);arm(1,12,-12);
  }
  if(!a.weapon){
   limb(-11,-27+offset,-15,-8+offset,4);
   limb(-11,-27+offset,-14,-12+offset,1.5);
  }
 }else if(!a.weapon){
  const angle=a.angle||0,dx=Math.cos(angle),dy=Math.sin(angle);
  const sx=(dx-dy)*32,sy=(dx+dy)*16;
  const length=Math.hypot(sx,sy)||1;
  const barrel=t.shape===2?30:21;
  const gx=sx/length*barrel,gy=sy/length*barrel;
  limb(4,-22,4+gx,-22+gy,6);
  limb(4,-24,4+gx,-24+gy,2);
 }
 if(a.boss){
  polygon([[-18,-35],[-8,-40],[-8,-19],[-19,-20]]);
 }
 return path;
};

function drawIdleHands(state,coat){
 const time=state.idleTime%20;
 ctx.save();
 ctx.lineCap="round";
 const arm=(side,x,y)=>{
  strokeLine(side*8,-25,side*12,-18,coat,5);
  strokeLine(side*12,-18,x,y,coat,4);
  ellipse(x,y,2.2,2.2,"#c5ad7b");
 };
 if(state.mode==="smoke"){
  const lift=.5-.5*Math.cos(time*1.7);
  const x=12-8*lift,y=-17-15*lift;
  arm(1,x,y);
  arm(-1,-10,-12);
  strokeLine(x,y,x+6,y-1,"#ddd2b9",2);
  ellipse(x+6,y-1,1.3,1.3,"#ed8740");
  for(let i=0;i<3;i++){
   const age=(time*.45+i/3)%1;
   ctx.globalAlpha=(1-age)*.3*soundLevel("flash",.5);
   ellipse(x+6+Math.sin(age*5+i)*4,y-3-age*25,
    1+age*4,2+age*5,"#e2dbc8");
  }
 }else if(state.mode==="eat"){
  // Сначала рука опускается к карману, затем поднимает банку.
  const take=clamp((time-.25)/1.1,0,1);
  const canX=-10+4*take,canY=-10-10*take;
  arm(-1,canX,canY+2);
  if(time>.25){
   ctx.fillStyle="#859487";
   ctx.fillRect(canX-4,canY-3,8,9);
   ellipse(canX,canY-3,4,2,"#d0cbb1");
   strokeLine(canX-3,canY+3,canX+3,canY+3,"#b89456",2);
  }
  const bite=time<1.5?0:.5-.5*Math.cos((time-1.5)*2.8);
  const handX=8-6*bite,handY=-18-13*bite;
  arm(1,handX,handY);
  strokeLine(handX,handY,handX-3,handY-3,"#d3d5c5",1.5);
  ellipse(handX-3,handY-3,1.5,1,"#d3d5c5");
 }else if(state.mode==="drink"){
  const pose=vodkaPose(time);
  arm(-1,-10,-12);
  arm(1,pose.x,pose.y);
  ink(vodkaBottlePoints(pose).map(([x,y])=>({x,y})),"#a6c7ae",1.2);
  ctx.save();
  ctx.translate(pose.x,pose.y);
  ctx.rotate(pose.angle);
  ctx.fillStyle="#f1e4c7";
  ctx.fillRect(-3,-1,6,5);
  ctx.fillStyle="#9b3d31";
  ctx.fillRect(-2,-9,4,2);
  ctx.fillStyle="#384638";
  ctx.font="bold 3px sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("40°",0,1.5);
  strokeLine(-2,4,-2,6,"#e2f2dc",1);
  ctx.restore();
  ellipse(pose.x,pose.y,2.2,2.2,"#c5ad7b");
 }else if(state.mode==="sit"){
  arm(-1,-12,-12);
  arm(1,12,-12);
 }
 ctx.restore();
}

drawActor = function(a, player = false) {
    if(!player&&a.hp<=0)return;
    if(!player&&mutantType(a)){drawMutant(a);return}
    if(!player&&a.bossKind==="donkey"){drawDonkey(a);return}
    const p = project(a.x, a.y);
    const boss = !!a.boss;
    const scale = boss ? 1.65 : 1;
    const t = player ? null : ENEMY_TYPES[a.type];
    const leisure=player||boss?null:enemyBehaviorStates.get(a);
    const idleMode=leisure?.map===S.map?leisure.mode:"";
    const sitting=idleMode==="sit";

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(scale, scale);

    ellipse(3, 1, 15, 6, "#302a2448");

    if (player && S.p.inv > 0 &&
      Math.floor(performance.now() / 65) % 2) {

const movedX = a.x - walk.x;
const movedY = a.y - walk.y;
const distance = Math.hypot(movedX, movedY);

// а не обычным шагом.
const moving = !paused && distance > .0001 && distance < 1;

  // Полный цикл примерно на каждые 1.3 клетки пути.
  walk.phase = (walk.phase + distance * 4.8) % (Math.PI * 2);

  // Преобразуем направление движения в экранное изометрическое.
  const screenX = (movedX - movedY) * 32;
  const screenY = (movedX + movedY) * 16;
  const screenLength = Math.hypot(screenX, screenY) || 1;

  const turnBlend = 1 - Math.exp(-18 * dt);

  walk.dirX += (screenX / screenLength - walk.dirX) * turnBlend;
  walk.dirY += (screenY / screenLength - walk.dirY) * turnBlend;

  const footY = walk.dirY * swing - lift;

  const kneeY = -6 + (footY * .45) - lift * .25;

  // Тёмный внешний контур.
  strokeLine(hipX, hipY, kneeX, kneeY, "#292820", 7);
  strokeLine(kneeX, kneeY, footX, footY, "#292820", 6);

  strokeLine(hipX, hipY, kneeX, kneeY, "#645c46", 4);
  strokeLine(kneeX, kneeY, footX, footY, "#4c493b", 3);

  strokeLine(

    footY,
    footX + 3,
    footY,
    "#302d25",

          strokeLine(p.x-20,p.y-8,p.x-20,p.y-36,"#43382b",4);
          strokeLine(p.x+12,p.y+8,p.x+12,p.y-20,"#43382b",4);
          strokeLine(p.x-20,p.y-36,p.x+12,p.y-20,"#43382b",4);
        }
      }else if(item.type==="furniture"){
        drawInteriorFurniture(o);
      }else if (item.type === "cap") {
        drawCapDrop(o);
      } else if (item.type === "combatFx") {
        drawCombatParticle(o);
      } else if (item.type === "bulletDrop") {
        drawBulletDrop(o);
      } else if (item.type === "building") {
        drawBuilding(o, theme);
      } else if (item.type === "decor") {
        drawDecor(o);
      } else if (item.type === "rock") {
        const p = project(o.x, o.y);
        const h = 23 + ((Math.floor(o.x) * 7 + Math.floor(o.y) * 11) % 19);

        ink([
          { x: p.x - 31, y: p.y },
          { x: p.x - 17, y: p.y - h },
          { x: p.x + 7, y: p.y - h - 7 },
          { x: p.x + 31, y: p.y - 5 },
          { x: p.x + 10, y: p.y + 14 }
        ], "#8d7858", 2);

        strokeLine(p.x - 13, p.y - h + 4, p.x + 4, p.y - h,
          "#c3ab7e", 2);
      } else if (item.type === "prop") {
        const p = project(o.x, o.y);

        if (o.kind === "barrel") {
          ctx.fillStyle = "#9c5035";
          ctx.fillRect(p.x - 10, p.y - 24, 20, 23);
          ctx.strokeStyle = "#352d25";
          ctx.lineWidth = 2;
          ctx.strokeRect(p.x - 10, p.y - 24, 20, 23);
          ellipse(p.x, p.y - 24, 10, 4, "#b6794e");
          ctx.stroke();
          strokeLine(p.x - 10, p.y - 15, p.x + 10, p.y - 15, "#473e31", 3);
          text("!", p.x, p.y - 5, 13, "#ebd7a4");
        } else {
          block(o.x, o.y, 19, "#9b8157", "#64563f", .6);
          strokeLine(p.x - 15, p.y - 17, p.x + 12, p.y - 2, "#453927", 2);
          strokeLine(p.x - 13, p.y - 3, p.x + 12, p.y - 17, "#453927", 2);
        }
      } else {
        drawActor(o, item.type === "player");
      }
    }

    drawBarrelExplosions();

    // Предупреждения рисуются поверх окружения для читаемости.
    for (const e of S.enemies) {
      if (e.hp <= 0 || e.bossKind==="donkey" || !visible(e.x, e.y)) continue;
      const behavior = enemyBehaviorStates.get(e);
      const alerted = behavior?.map === S.map && behavior.alert > 0;
      if (!alerted && !(e.wind > 0)) continue;

      const p = project(e.x, e.y, 19);
      const markerY = p.y - (e.boss ? 83 : 47);
      ctx.save();
      ctx.font = "bold 25px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.lineJoin = "round";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#fff0cf";
      ctx.strokeText("!", p.x, markerY);
      text("!", p.x, markerY, 25, "#d52319");
      ctx.restore();

      if (e.boss && e.wind > 0) {
        ctx.strokeStyle = "#a82d22";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y + 19, 100, 50, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    for (const b of S.bullets) {
      if (!visible(b.x, b.y, 20)) continue;
      if(b.donkeyPellet){drawDonkeyPellet(b);continue}
      if(drawSpecialProjectile(b))continue;

      const p = project(b.x, b.y, 19);
      const prev = project(b.x - b.vx * .012, b.y - b.vy * .012, 19);

      strokeLine(prev.x, prev.y, p.x, p.y,
        b.enemy ? "#bd3c28" : "#fff0bb", b.enemy ? 4 : 3);

      if (b.enemy) {
        ellipse(p.x, p.y, 3, 3, "#ea8450");
      }
    }

    ctx.globalAlpha = settings.flash;
    for (const f of S.fx) {
      const p = project(f.x, f.y, 15);
      ctx.fillStyle = f.color === "#fff" ? "#f5d79b" : "#c4894e";
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    drawReloadProgress();
    drawHealingStatus();

    // Редкие ветровые полосы: не закрывают персонажей и пули.
    ctx.globalAlpha = .08 * settings.flash;
    for (let i = 0; i < (m.interior?0:12); i++) {
      const x = ((i * 173 + clock * 21) % (W + 180)) - 90;
      const y = (i * 97 + Math.sin(clock * .2 + i) * 20) % H;
      strokeLine(x, y, x + 75, y - 5, "#fff0cb", 2);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // Мягкое затемнение краёв — без цветового фильтра поверх объектов.
    const vignette = ctx.createRadialGradient(
      W / 2, H / 2, H * .25,
      W / 2, H / 2, Math.max(W, H) * .72
    );
    vignette.addColorStop(0, "#38271400");
    vignette.addColorStop(1, "#38271440");
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    drawMinimap();
    drawHUD();

    if (!paused) {
      ctx.strokeStyle = "#342c22";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 6, 0, Math.PI * 2);
      ctx.moveTo(mouse.x - 12, mouse.y);
      ctx.lineTo(mouse.x - 8, mouse.y);
      ctx.moveTo(mouse.x + 8, mouse.y);
      ctx.lineTo(mouse.x + 12, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - 12);
      ctx.lineTo(mouse.x, mouse.y - 8);
      ctx.moveTo(mouse.x, mouse.y + 8);
      ctx.lineTo(mouse.x, mouse.y + 12);
      ctx.stroke();
    }
    flushPortalLabels();
  };

  // ---------------- Интерфейс и новая терминология ----------------

  const originalHUD = drawHUD;

  drawHUD = function() {
    originalHUD();

    const hint = $("#hint");
    hint.textContent = hint.textContent
      .replace("Портал закрыт: победите Дискоядро", "Маяк заглушён: победите Железного смотрителя");
  };

  const originalToast = toast;

  toast = function(message) {
    originalToast(
      message
        .replace("«Дискоядро»", "«Железный смотритель»")
        .replace("Найдите портал.", "Найдите эвакуационный маяк.")
    );
  };

  menu();
})();
</script>
</body>
